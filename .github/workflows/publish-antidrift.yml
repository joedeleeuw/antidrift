name: Publish Antidrift

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-native-binaries:
    if: startsWith(github.event.release.tag_name, 'antidrift-v')
    runs-on: ${{ matrix.runner }}
    environment: npm-publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
          - runner: macos-15-intel
            package: darwin-x64
          - runner: macos-14
            package: darwin-arm64
          - runner: windows-latest
            package: win32-x64-msvc
          - runner: windows-11-arm
            package: win32-arm64-msvc
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - run: npm install -g npm@latest

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./tooling/antidrift/package.json').version")"
          EXPECTED_TAG="antidrift-v${VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi

      - name: Stage platform package
        run: node tooling/antidrift/scripts/stage-platform-package.mjs "${{ matrix.package }}" "${{ runner.temp }}/platform-package"

      - name: Publish platform package
        run: npm publish "${{ runner.temp }}/platform-package" --access public

  publish:
    if: startsWith(github.event.release.tag_name, 'antidrift-v')
    needs: build-native-binaries
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm install -g npm@latest
      - run: node --version && npm --version && pnpm --version && cargo --version
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./tooling/antidrift/package.json').version")"
          EXPECTED_TAG="antidrift-v${VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - run: pnpm verify:release

      - name: Pack package
        run: pnpm --dir tooling/antidrift pack --pack-destination "$RUNNER_TEMP/antidrift-pack"

      - name: Publish packed tarball
        run: npm publish "$RUNNER_TEMP"/antidrift-pack/*.tgz --access public
