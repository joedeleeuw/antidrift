name: Publish Antidrift

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-packages:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'antidrift-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            package: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
          - runner: macos-15-intel
            package: darwin-x64
          - runner: macos-14
            package: darwin-arm64
          - runner: windows-latest
            package: win32-x64-msvc
          - runner: windows-11-arm
            package: win32-arm64-msvc
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          standalone: true
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./tooling/antidrift/package.json').version")"
          EXPECTED_TAG="antidrift-v${VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi

      - name: Smoke the packed package on this platform
        run: pnpm package:verify

      - name: Pack platform package
        shell: bash
        run: |
          node tooling/antidrift/scripts/stage-platform-package.mjs "${{ matrix.package }}" "$RUNNER_TEMP/platform-package"
          mkdir -p "$RUNNER_TEMP/platform-pack"
          npm pack "$RUNNER_TEMP/platform-package" --pack-destination "$RUNNER_TEMP/platform-pack"

      - uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.package }}
          path: ${{ runner.temp }}/platform-pack/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'antidrift-v')
    needs: platform-packages
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: npm install -g npm@latest
      - run: node --version && npm --version && pnpm --version && cargo --version
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./tooling/antidrift/package.json').version")"
          EXPECTED_TAG="antidrift-v${VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - run: pnpm verify:release

      - uses: actions/download-artifact@v8
        with:
          pattern: platform-*
          path: ${{ runner.temp }}/platform-packs
          merge-multiple: true

      - name: Publish platform packages
        run: |
          for tarball in "$RUNNER_TEMP"/platform-packs/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json | node -p 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); `${m.name}@${m.version}`')"
            built="$(node -p '`sha512-${require("crypto").createHash("sha512").update(require("fs").readFileSync(process.argv[1])).digest("base64")}`' "$tarball")"
            published="$(npm view "$spec" dist.integrity 2> /dev/null || true)"
            if [ -z "$published" ]; then
              npm publish "$tarball" --access public
            elif [ "$published" = "$built" ]; then
              echo "${spec} is already on npm with this run's tarball"
            else
              echo "${spec} is on npm with a different tarball (${published}, this run built ${built}); release a new version" >&2
              exit 1
            fi
          done

      - name: Wait until every platform package resolves
        run: |
          for tarball in "$RUNNER_TEMP"/platform-packs/*.tgz; do
            spec="$(tar -xOzf "$tarball" package/package.json | node -p 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); `${m.name}@${m.version}`')"
            for attempt in $(seq 1 60); do
              npm view "$spec" version > /dev/null 2>&1 && break
              sleep 10
            done
            npm view "$spec" version > /dev/null || { echo "${spec} did not resolve on npm within 10 minutes" >&2; exit 1; }
          done

      - name: Pack package
        run: pnpm --dir tooling/antidrift pack --pack-destination "$RUNNER_TEMP/antidrift-pack"

      - name: Publish packed tarball
        run: npm publish "$RUNNER_TEMP"/antidrift-pack/*.tgz --access public
