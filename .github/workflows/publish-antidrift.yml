name: Publish Antidrift

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'antidrift-v'))
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="antidrift-v${VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "release tag ${RELEASE_TAG} must match ${EXPECTED_TAG}" >&2
            exit 1
          fi
      - run: pnpm check
      - name: Pack and publish package
        run: |
          TARBALL="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          npm publish "$TARBALL" --provenance --access public
