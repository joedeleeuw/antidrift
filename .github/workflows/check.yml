name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi
      - run: pnpm check:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy-reports-node-${{ matrix.node }}
          path: reports
