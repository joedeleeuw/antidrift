name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-15
            node: 26
          - os: windows-latest
            node: 26
    steps:
      - name: Allow long paths in git checkouts
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release --locked -p antidrift-linter -p antidrift-napi
      - run: pnpm check:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: reports
