[workspace]
resolver = "2"
members = [
  "crates/antidrift-kernel",
  "crates/antidrift-rules",
  "crates/antidrift-linter",
]

[workspace.package]
version = "0.20.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
antidrift-kernel = { path = "crates/antidrift-kernel" }
antidrift-rules = { path = "crates/antidrift-rules" }
globset = "0.4.18"
ignore = "0.4.25"
oxc_resolver = "11.24.3"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rayon = "1.12.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.119", features = ["full", "visit", "extra-traits"] }
thiserror = "2"
tsrs_ast = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_checker = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_compiler = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_contentmapper = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_core = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_diagnostics = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_parser = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_tsoptions = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrs_vfs = { git = "https://github.com/maschwenk/tsrs", branch = "main" }
tsrslint = { git = "https://github.com/maschwenk/tsrslint", rev = "feea8d69d1cca176fb08318eb167c9013cce2630", default-features = false }
yaml_serde = "0.10.7"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
let_underscore_drop = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
unfulfilled_lint_expectations = "deny"
unit_bindings = "deny"
unused_crate_dependencies = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
unused_variables = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
assigning_clones = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
cloned_instead_of_copied = "deny"
cognitive_complexity = "deny"
collapsible_if = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
excessive_nesting = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
format_push_string = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
inline_always = "deny"
iter_on_single_items = "deny"
iter_over_hash_type = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
manual_let_else = "deny"
many_single_char_names = "deny"
map_err_ignore = "deny"
match_same_arms = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
needless_pass_by_value = "deny"
non_send_fields_in_send_ty = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pub_underscore_fields = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
rest_pat_in_fully_bound_structs = "deny"
semicolon_if_nothing_returned = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
stable_sort_primitive = "deny"
str_to_string = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "deny"
try_err = "deny"
type_complexity = "deny"
unimplemented = "deny"
unnecessary_box_returns = "deny"
unnecessary_self_imports = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unused_result_ok = "deny"
unused_self = "deny"
unwrap_used = "deny"
vec_box = "deny"
wildcard_imports = "deny"
zero_sized_map_values = "deny"
