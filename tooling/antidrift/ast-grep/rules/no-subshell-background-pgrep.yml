id: no-subshell-background-pgrep
language: Bash
severity: error
message: Do not launch a background command in a subshell `( ... & )` and recover its PID with `pgrep -f`. Launch directly, record `$!` (or `pgrep -P`), and `trap ... EXIT` to clean up.
metadata:
  antidrift:
    structuralProofKinds:
      - program
      - subshell
      - command
      - command_name
      - word
    regexPolicy:
      allowedNodeKinds:
        - subshell
        - command_name
        - word
      reason: Regex narrows the subshell background terminator, the pgrep command name, and the -f/--full flag; the enclosing scope and command invocation are matched structurally.
rule:
  all:
    - kind: command
    - has:
        kind: command_name
        regex: "^pgrep$"
        stopBy: end
    - has:
        kind: word
        regex: "^(-[a-zA-Z]*f[a-zA-Z]*|--full)$"
        stopBy: end
    - inside:
        any:
          - kind: program
          - kind: compound_statement
        has:
          all:
            - kind: subshell
            - regex: "&\\s*\\)\\s*$"
          stopBy: end
        stopBy: end
