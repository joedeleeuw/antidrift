id: no-unprotected-piped-gate-before-action
language: Bash
severity: error
message: Do not pipe a gate command through `tail`, `head`, or `tee` before `&& git push`, `&& wt merge`, or `&& wt remove` without `set -o pipefail` in scope; the pipeline exit status is the consumer's, not the gate's.
metadata:
  antidrift:
    structuralProofKinds:
      - list
      - pipeline
      - command
      - command_name
    regexPolicy:
      allowedNodeKinds:
        - command_name
        - command
      reason: Regex narrows the output-consuming filter command, the gated git/wt action, and the pipefail set option; the pipeline and && list are matched structurally.
rule:
  all:
    - kind: list
    - has:
        all:
          - kind: pipeline
          - has:
              all:
                - kind: command
                - has:
                    kind: command_name
                    regex: "^(tail|head|tee)$"
                    stopBy: end
              stopBy: end
        stopBy: end
    - has:
        all:
          - kind: command
          - regex: "^(git\\s+push|wt\\s+(merge|remove))(\\s|$)"
        stopBy: end
    - not:
        inside:
          any:
            - kind: program
            - kind: subshell
            - kind: compound_statement
          has:
            all:
              - kind: command
              - has:
                  kind: command_name
                  regex: "^set$"
                  stopBy: end
              - regex: "pipefail"
            stopBy: end
          stopBy: end
