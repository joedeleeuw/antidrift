id: no-unprotected-piped-gate-before-action
valid:
  - |
    pnpm policy:verify-session && git push
  - |
    set -euo pipefail
    pnpm policy:verify-session | tee gate.log && git push
  - |
    set -o pipefail
    cargo test | tail -n 20 && wt merge
  - |
    pnpm policy:verify-session | tail -n 20
invalid:
  - |
    pnpm policy:verify-session | tail -n 20 && git push
  - |
    pnpm test | tee test.log && wt merge
  - |
    cargo check | head -n 30 && wt remove feature-branch
