avoid-breaking-exported-api = false
cognitive-complexity-threshold = 20
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
excessive-nesting-threshold = 4

disallowed-types = [
  { path = "std::collections::HashMap", reason = "SipHash and nondeterministic iteration; use rustc_hash::FxHashMap or tsrs_core::collections::OrderedMap" },
  { path = "std::collections::HashSet", reason = "SipHash and nondeterministic iteration; use rustc_hash::FxHashSet or tsrs_core::collections::OrderedSet" },
]

disallowed-methods = [
  { path = "slice::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "slice::get_unchecked_mut", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "str::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "core::hint::unreachable_unchecked", reason = "use unreachable!() unless a measurement shows its cost" },
  { path = "core::option::Option::unwrap_unchecked", reason = "use ? or explicit error handling unless a measurement shows its cost" },
  { path = "core::result::Result::ok", reason = "handle or propagate Result explicitly instead of erasing the error into Option" },
  { path = "core::result::Result::unwrap_or_default", reason = "handle or propagate Result explicitly instead of silently substituting Default::default()" },
  { path = "core::result::Result::unwrap_unchecked", reason = "use ? or explicit error handling unless a measurement shows its cost" },
  { path = "tsrs_ast::Node::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::StringLiteral::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::NoSubstitutionTemplateLiteral::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::TemplateHead::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::TemplateMiddle::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::TemplateTail::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::LiteralLikeNodeBase::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "tsrs_ast::TemplateLiteralLikeNodeBase::text", reason = "tsrs stores lone-surrogate escapes as WTF-8 inside str; read cooked text through antidrift_kernel::tsrs_kernel::cooked_text" },
  { path = "core::str::from_utf8_unchecked", reason = "use from_utf8 unless a measurement shows its cost" },
]

disallowed-macros = [
  { path = "std::dbg", reason = "debugging leftover" },
]
