avoid-breaking-exported-api = false
cognitive-complexity-threshold = 20
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
excessive-nesting-threshold = 4

disallowed-types = [
  { path = "std::collections::HashMap", reason = "SipHash and nondeterministic iteration; use rustc_hash::FxHashMap or tsrs_core::collections::OrderedMap" },
  { path = "std::collections::HashSet", reason = "SipHash and nondeterministic iteration; use rustc_hash::FxHashSet or tsrs_core::collections::OrderedSet" },
]

disallowed-methods = [
  { path = "slice::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "slice::get_unchecked_mut", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "str::get_unchecked", reason = "keep the bounds check unless a measurement shows its cost" },
  { path = "core::hint::unreachable_unchecked", reason = "use unreachable!() unless a measurement shows its cost" },
  { path = "core::option::Option::unwrap_unchecked", reason = "use ? or explicit error handling unless a measurement shows its cost" },
  { path = "core::result::Result::unwrap_unchecked", reason = "use ? or explicit error handling unless a measurement shows its cost" },
  { path = "core::str::from_utf8_unchecked", reason = "use from_utf8 unless a measurement shows its cost" },
]

disallowed-macros = [
  { path = "std::dbg", reason = "debugging leftover" },
]
