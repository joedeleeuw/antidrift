    corpusRepositories: [chaski, codebase-atlas, sudocode-main, opencode]
    concerns:
      - The rule is intentionally limited to broad-input predicates that assert nontrivial object contracts.
      - Codebase Atlas supplies clean controls for primitive predicates, alias-based field checks, and third-party union predicates.
      - Chaski supplies a destructured-field clean control for object predicates.
      - Sudocode supplies clean controls for field-complete broad-input predicates and discriminant-only union predicates.
      - "Claude Opus 4.8 review on 2026-06-15 challenged the previous promotion evidence: Opencode was only a one-file target, and optional properties were being counted as required predicate proof."
      - "Chaski RetoolLineItemData and Opencode TriggerTitle are clean controls under the current required-field proof floor; optional-field sufficiency remains inventory/research instead of a blocking diagnostic."
      - "pnpm policy:inventory-underchecked-predicate now makes the broad predicate sweep reproducible: 1,353 type-aware files, 64 type-predicate candidate files, 112 type-predicate signatures, 0 custom findings, 0 parser errors, and 0 drift repositories."
      - Validator delegation is allowed, so stable promotion should classify schema-backed predicate inventories.
      - Discriminant guards over already-typed unions stay outside the report path.
      - The verdict layer is heuristic; validator-looking helper names and incidental member reads can cause false negatives.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported type-aware rule was found that checks whether a predicate body validates enough of the asserted object type."
      whyNotOtherState: "Not equivalent to discriminated-union exhaustiveness because this rule targets broad-input guard laundering."
    examples:
      flags:
        - 'const isUser = (value: unknown): value is User => value != null && typeof value === "object";'
      allows:
        - 'function isDateMessage(value: unknown): value is DateMessage { return !!value && typeof value === "object" && "year" in value && "month" in value && "day" in value; }'
    nextAction: Keep default-off; find real broad-input predicate drift that misses required asserted fields before re-enabling or promoting.
  antidrift/no-unsafe-deserialize:
    status: ready
    stable: true
    signal: TypeChecker plus local string-boundary control flow
    solveType: parse-at-edge
    promotion:
      proofBucket: semantic-source-type-provenance
      association: JSON.parse input provenance to broad any/unknown values and local string proof.
      blockingThreshold: Broad any/unknown parse input reports unless TypeScript or local control flow proves the parse input is a string.
      ecosystemComparison: "@typescript-eslint/no-unsafe-argument catches all current broad-input JSON.parse drift when forced on, but it is an unconfigurable any-argument-wide migration; the Antidrift rule is justified only as a narrower parse-boundary gate with lower unrelated inventory."
      corpusEvidence: Chaski, Codebase Atlas, Sudocode, and Opencode provide broad parse-input drift plus string-input clean controls.
      realCorpusInventory: docs/rule-investigations/no-unsafe-deserialize.md and docs/stable-promotion-inventory.md record Sudocode, Codebase Atlas, and Opencode parse-input drift plus Chaski, Codebase Atlas, Opencode, and Sudocode clean controls.
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-unsafe-deserialize.md
        - docs/stable-promotion-inventory.md
      claudeAdvisoryReview: reports/claude-rule-review-no-unsafe-deserialize-20260604-145356.md and docs/rule-investigations/no-unsafe-deserialize.md record advisory review and the closed parser-service blocker.
      claudeAdvisoryReviewRefs:
        - reports/claude-rule-review-no-unsafe-deserialize-20260604-145356.md
        - docs/rule-investigations/no-unsafe-deserialize.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: 0
      productionConcerns: none
      noSinkBehavior: This rule emits no semantic facts; diagnostics depend on TypeScript parser services and local parse-input provenance.
      noDeadWorkBehavior: Already-string inputs, local typeof string guards, string-typed inputs that are immediately schema-validated after parsing, and parse-output cast cases owned by no-appeasement-cast stay clean.
    referenceDoc: docs/rule-investigations/no-unsafe-deserialize.md
    corpusRepositories: [chaski, codebase-atlas, sudocode-main, opencode]
    concerns:
      - Cloudflare Agents type-aware deserialize cases remain external-corpus inventory only because the checkout's tsconfigs extend agents/tsconfig without an install-resolvable package path.
      - Parse-output contract assertions such as JSON.parse(event.data as string) as OutgoingMessage are owned by antidrift/no-appeasement-cast, not this parse-input rule.
    external:
      state: partial-overlap
      support: high
      candidates: ["@typescript-eslint/no-unsafe-argument"]
      decision: own-antidrift
      whyThisState: "The ecosystem rule catches the current any-to-JSON.parse drift, but also reports unrelated any-argument flows and has no narrowing options."
      whyNotOtherState: "Not equivalent as a distributable default because the desired rule is specifically parse-at-edge guidance for broad JSON input and typed consumption."
    examples:
      flags:
        - "JSON.parse(row.source as any);"
        - "JSON.parse(row.config_json); // when row.config_json is checker-typed as any"
      allows:
        - "const value = JSON.parse(text);"
        - 'if (typeof event.data !== "string") return; JSON.parse(event.data);'
        - "const parsed = schema.parse(JSON.parse(text));"
    nextAction: Stable only as a narrow parse-boundary specialization; retire or demote if @typescript-eslint/no-unsafe-argument becomes acceptable as a broad consumer default.
  antidrift/require-authz-check:
