      association: SQL string fragments to bound values, identifier allowlists, escaping helpers, safe members, import-bound or declaration-source template builders, or unsafe interpolation.
      blockingThreshold: Unsafe value interpolation in SQL context reports; identifier interpolation reports only when the checker cannot prove a bound, allowlisted, escaped, static, configured-safe source, import-bound SQL builder tag, or declaration-source SQL builder member.
