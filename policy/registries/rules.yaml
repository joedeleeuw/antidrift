      corpusEvidence: The source-fleet SQL inventory checked 1,378 SQL-candidate files across 24 repos with 486 custom findings and 0 parser errors after name-only member proof was removed. External corpus still proves Opencode Drizzle tags, Cloudflare core Agent.sql, and PowerSync AbstractPostgresConnection.sql clean through import/declaration-source provenance; two Cloudflare package SQL-tag cases remain parked on external tsconfig/type-service availability, and the broad source fleet is now high-noise inventory until additional SQL-builder declaration proof is classified.
