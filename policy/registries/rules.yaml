rules:
  antidrift/no-appeasement-cast:
    status: ready
    stable: false
    signal: TypeChecker
    solveType: type-escape-hatch
    proofBuckets: [semantic-source-type-provenance]
    promotion:
      proofBucket: semantic-source-type-provenance
      association: TypeChecker proves an `as` assertion takes an `any` or `unknown` source expression and claims a named object contract with resolved properties.
      blockingThreshold: Plain `value as NamedObjectContract` reports only when the source type is `any` or `unknown`, the target is a named object contract with at least one property, and the target is not a branded type delegated to the retired brand-specific branch.
      ecosystemComparison: The maintained @typescript-eslint/no-unsafe-type-assertion rule is a strict superset in the measured corpus; it reports every no-appeasement-cast location but also reports typed SDK/API conversion pressure that this custom rule keeps clean through the source-type gate.
      corpusEvidence: Chaski, Codebase Atlas, and Sudocode broad inventories classify broad-input casts into named contracts as drift, with copy-backed Chaski and Codebase Atlas remediation proving caught-error guards, serialized-storage parsing, schema-backed object-contract validation, and third-party bag guards.
      realCorpusInventory: docs/rule-investigations/no-appeasement-cast.md and reports/no-appeasement-inventory-*.json record broad real-repo inventory; reports/unsafe-type-assertion-benchmark.json records the maintained-upstream comparison.
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-appeasement-cast.md
        - reports/unsafe-type-assertion-benchmark.json
        - reports/no-appeasement-inventory-chaski-portal.json
        - reports/no-appeasement-inventory-codebase-atlas-app.json
        - reports/no-appeasement-inventory-sudocode-server.json
      claudeAdvisoryReview: reports/claude-rule-review-no-appeasement-cast-20260603-205832.md classifies the rule as not ecosystem-covered and locally ready, but blocks stable promotion on unclassified broad inventory and productionization concerns.
      claudeAdvisoryReviewRefs:
        - reports/claude-rule-review-no-appeasement-cast-20260603-205832.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: Angle-bracket assertions, source laundering hidden behind an intermediate typed value, and some generic-helper boundaries are outside the current single-expression proof.
      productionConcerns: Broad inventory still needs rerun/classification after real consumer cleanup; test-file casts remain in scope but do not count as production drift evidence; Cloudflare parse-output contract casts remain parked on external tsconfig resolution.
      noSinkBehavior: This rule emits no semantic facts; diagnostics depend on parser services and TypeChecker source/target proof, not sink availability.
      noDeadWorkBehavior: Typed-source SDK conversions, typed DOM event casts, guards, schema parses, brand constructors, and maintained upstream double-cast coverage stay clean or delegated.
    referenceDoc: docs/rule-investigations/no-appeasement-cast.md
    corpusRepositories: [chaski, codebase-atlas, sudocode-main, opencode]
    concerns:
      - Broad inventory classified all current Chaski, Codebase Atlas, and Sudocode findings as real boundary/type-escape drift or in-scope test setup.
      - Copy-backed remediation evidence now covers caught-error guards, serialized browser storage validation, schema-backed object-contract checks, and third-party bag guards; do not add more copy-only remediation before the next promotion review.
      - Test-file casts remain in scope and should report, but test-only findings do not count as production drift evidence for stable promotion.
      - The rule has no explicit SDK/API allowlist; typed conversions stay clean only when the source is not any or unknown.
      - The upstream @typescript-eslint/no-unsafe-type-assertion benchmark checked 2,585 real files and reported every no-appeasement-cast location, but also produced 1,517 upstream-only locations; keep upstream as an optional strict benchmark rather than the default replacement.
      - Cloudflare Agents has production WebSocket JSON parse-output contract assertions in packages/ai-chat/src/ws-chat-transport.ts, but that external checkout cannot currently resolve agents/tsconfig for type-aware evaluation.
    external:
      state: broader-upstream
      support: high
      candidates: ["@typescript-eslint/no-unsafe-type-assertion"]
      decision: own-antidrift
      whyThisState: "The upstream rule catches some appeasement casts, but it covers a much broader assertion policy than this rule."
      whyNotOtherState: "Not equivalent because Chaski clean controls include SDK/API conversion casts that the upstream rule also reports."
    examples:
      flags:
        - "const err = caught as AxiosError;"
      allows:
        - "if (axios.isAxiosError(caught)) return caught.response?.status;"
    nextAction: Keep default-off inventory; stop copy-only remediation for this phase and rerun broad inventory after real consumer cleanup before blocking promotion.
  antidrift/no-async-array-method:
    status: ready
    stable: false
    defaultOff: true
    signal: AST
    solveType: promise-control-flow
    proofBuckets: [local-ast-source-shape, semantic-source-type-provenance]
    promotion:
      proofBucket: local-ast-source-shape
      association: Async callback syntax is associated with array method semantics. The default branch covers never-await methods that discard callback promises; the optional `requires-collection` branch tracks map/flatMap promise collections to Promise combinators.
      blockingThreshold: Default diagnostics report never-await array methods with async callbacks. The optional additive `requires-collection` branch also reports map/flatMap when the promise collection is not returned, is not directly passed to Promise.all, Promise.allSettled, or Promise.race, and is not assigned to a local variable later consumed by one of those Promise combinators.
      ecosystemComparison: TypeScript ESLint no-misused-promises can catch async callbacks in void-return argument positions when broad checksVoidReturn.arguments is enabled, and no-floating-promises catches unhandled promise-valued expressions; neither gives the same array-method-only scope without broader Express-style handler pressure, and no-floating-promises does not treat an array of promises from `.map(async ...)` as a promise-valued expression.
      corpusEvidence: Chaski and Codebase Atlas provide clean controls for Promise.all and Promise.allSettled over async maps. Sudocode supplies the only current drift, a test cleanup forEach(async ...) that starts cleanup requests without awaiting them.
      realCorpusInventory: docs/rule-investigations/no-async-array-method.md and reports/no-async-array-method-inventory-2026-06-04T01-47-55-111Z.json record 2,293 checked files with one Sudocode test cleanup finding and broad clean controls.
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-async-array-method.md
        - reports/no-async-array-method-inventory-2026-06-04T01-47-55-111Z.json
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: Interprocedural promise collection handoff, custom Promise combinators, aliases that escape the local function, and floated Promise combinator results are outside the optional collection-flow proof. By default, map/flatMap collection-flow is intentionally disabled.
      productionConcerns: Only one drift repo is pinned and the only finding is test cleanup code. The default never-await branch and optional map/flatMap not-collected branch have separate promotion gates.
      noSinkBehavior: This rule emits no semantic facts; diagnostics are purely local AST/control-flow and do not depend on sink availability.
      noDeadWorkBehavior: >-
        for...of awaits stay clean in the default branch. When the additive
        `requires-collection` branch is explicitly configured, returned promise
        arrays, direct Promise.all/Promise.allSettled/Promise.race wrapping, and
        locally assigned promise arrays passed to those Promise combinators stay
        clean. Whether the combinator result is itself awaited is delegated to
        @typescript-eslint/no-floating-promises or a separate config gate.
    referenceDoc: docs/rule-investigations/no-async-array-method.md
    corpusRepositories: [chaski, codebase-atlas, sudocode-main]
    concerns:
      - Broad local inventory found no false positives across Chaski and Codebase Atlas, but real drift still replicates only in Sudocode test cleanup code.
      - Keep stable false until a second independent real drift is found or the project explicitly accepts one-repo drift evidence for this deterministic AST rule.
      - The default never-await method branch and opt-in map/flatMap not-collected branch have different proof burdens and separate promotion gates.
    external:
      state: partial-overlap
      support: high
      candidates:
        [
          "@typescript-eslint/no-misused-promises",
          "@typescript-eslint/no-floating-promises",
        ]
      decision: own-antidrift
      whyThisState: "The ecosystem pair can catch async callbacks in some array APIs when broad void-return checks are enabled, and catches floated Promise expressions."
      whyNotOtherState: "Not equivalent because the needed no-misused-promises option also reports real Express-style handlers, while no-floating-promises does not catch array-of-promises values from async maps."
    examples:
      flags:
        - "items.forEach(async (item) => await save(item));"
        - 'items.map(async (item) => save(item)); // only with branches: ["requires-collection"]'
      allows:
        - "for (const item of items) await save(item);"
        - "await Promise.all(items.map(async (item) => save(item)));"
    nextAction: "Keep default-off inventory while seeking a second never-await drift source. The map/flatMap not-collected branch is explicit opt-in and keeps a separate dataflow evidence gate."
  antidrift/no-handrolled-resource-lifecycle-cells:
    status: under-proven
    stable: false
    defaultOff: true
    signal: source binding plus local transition/control-flow proof
    solveType: react-state-shape
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-roadmap.md
    corpusRepositories: [chaski, sudocode-main, cloudflare-agents, murderbox]
    concerns:
      - "After the lifecycle proof rewrite, local fixed-proof scans checked 3,323 files across Chaski, Sudocode, Murderbox, Codebase Atlas, Opencode UI/console, Cloudflare Agents, and PowerSync; they classified 230 broad co-mutation inventory facts and emitted 9 resourceLifecycleProof diagnostics across Chaski, Sudocode, and Cloudflare Agents."
      - "Pinned drift anchors include Chaski reporting screens, Sudocode execution handlers, and Cloudflare examples; pinned clean controls include Murderbox auth-form submit state plus Chaski synchronous/view-state controls."
      - Broad co-mutation is inventory only; blocking requires a transition that toggles a boolean lifecycle cell, writes a distinct error cell inside catch, and assigns a distinct payload cell from an awaited value or first-level awaited source member.
      - The status-triplet derivability branch belongs here as a redundant-constant-cell proof instead of remaining a standalone name-group rule.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported React rule was found that models multiple local state setters as one state-machine smell."
      whyNotOtherState: "Not partial-overlap because generic hooks rules do not reason about coupled setter bindings in one handler."
    examples:
      flags:
        - "onClick={() => { setData(data); setLoading(false); setError(null); }}"
      allows:
        - "setDataOne(left); setDataTwo(right);"
        - 'dispatch({ type: "loaded", data });'
    nextAction: Human-review the multi-repo positives, add/remediate clean controls where review finds ordinary form or mutation state, and keep the default-off rule under-proven until promotion has zero known false positives.
  antidrift/no-shattered-ingested-entity-state:
    status: under-proven
    stable: false
    defaultOff: true
    signal: source binding plus local transition/source-member provenance
    solveType: react-state-shape
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-investigations/no-shattered-ingested-entity-state.md
    corpusRepositories: [chaski]
    concerns:
      - This rule is inventory-only — it records semantic source-member fan-out as `sourceMemberStateShardCandidate` and never reports a diagnostic.
      - The owned-entity enforcement tier was removed after multi-repo scans (chaski, sudocode) found zero real human-authored owned-entity shatters; every semantic source-member hit was a response envelope, value object, or computed result, which the rule correctly leaves alone.
      - Editable draft fields stay clean when cells are controlled by input value/checked props and event-derived setters.
      - Re-promotion to enforcement requires several real human-authored owned-entity shatters across more than one repo (likely an agent-generated corpus), plus pagination/query-metadata/envelope/denormalized-view-state clean controls.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No maintained React rule was found that models one fetched entity object being split into sibling state cells by source-member provenance."
      whyNotOtherState: "Not partial-overlap because Hooks and React rules reason about hook legality, dependencies, and derivation, not setter-to-source-member cohesion."
    examples:
      flags:
        - "const user = await fetchUser(); setId(user.id); setName(user.name);"
      allows:
        - "const user = await fetchUser(); setUser(user);"
        - "<input value={name} onChange={(event) => setName(event.currentTarget.value)} />"
    nextAction: Mine an agent-generated corpus (plus additional real React repos) for genuine owned-entity shatters; only with several cross-repo positives and envelope/pagination/view-state clean controls should the enforcement tier be rebuilt. Until then this stays inventory-only.
  antidrift/no-defensive-shape-probing:
    status: ready
    stable: false
    signal: TypeChecker plus AST shape
    solveType: broad-value-shape-probing
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-investigations/no-defensive-shape-probing.md
    corpusRepositories: [chaski, sudocode-main, codebase-atlas, opencode]
    concerns:
      - Object.entries extractor branch has real Chaski drift evidence.
      - Boolean predicate helper branch was removed and remains separate research.
      - The rule now requires the entries value binding to be any/unknown before shape-probe counting matters.
      - Benchmarking shows the current any-typed Chaski drift is also reported by @typescript-eslint unsafe member-access rules on the individual property reads, while antidrift reports one callback-level architectural finding.
      - "pnpm policy:inventory-defensive-shape now makes the sunset sweep reproducible: 1,680 type-aware files, 72 Object.entries transform syntax candidates, 1 custom finding, 0 parser errors, and 1 drift repository."
      - Stable promotion remains blocked; the reproducible sweep found no second drift repository and the one Chaski finding has same-file upstream unsafe-rule overlap.
      - Claude Opus 4.8 advisory review recommends demoting to inventory/off or retiring if no second drift appears beyond upstream unsafe-member coverage.
    external:
      state: partial-overlap
      support: medium
      candidates:
        - "@typescript-eslint/no-unsafe-member-access"
        - "@typescript-eslint/no-unsafe-return"
        - "@typescript-eslint/no-unsafe-assignment"
      decision: own-antidrift
      whyThisState: "TypeScript ESLint unsafe rules catch many any-leak symptoms, including the current Chaski member-access reads, but they do not group Object.entries mini-parsers or point to owned schema/converter construction."
      whyNotOtherState: "Not ecosystem-covered because the custom rule's value is the callback-level normalization smell and replacement path; not net-antidrift because the current any-typed drift has upstream unsafe-rule overlap."
    examples:
      flags:
        - 'Object.entries(raw as Record<string, unknown>).map(([, value]) => "numberValue" in value ? value.numberValue : null)'
      allows:
        - "const parsed = schema.parse(raw);"
        - "Object.entries(typedMap).map(([id, value]) => value.name)"
    nextAction: Keep as explicit default-off package inventory after the parser-clean sunset sweep; do not promote unless a second real drift repository appears, preferably with unknown-typed broad values not already explained by upstream unsafe-member rules.
  antidrift/no-inline-structural-type-at-use-site:
    status: ready
    stable: false
    defaultOff: true
    signal: AST
    solveType: type-contract-shape
    proofBuckets: [local-ast-source-shape]
    promotion:
      proofBucket: local-ast-source-shape
      association: Inline object type literals to implementation parameters on exported non-JSX functions, public methods of exported classes, or boundary object methods returned from exported factories.
      blockingThreshold: A diagnostic emits only for a `TSTypeLiteral` directly annotating an implementation parameter whose function is an exported non-JSX boundary, a public exported-class method, or a method of an exported/returned boundary object.
      ecosystemComparison: ESLint no-restricted-syntax can ban `TSTypeLiteral`, but cannot express the current exported non-JSX, exported-class-method, and boundary-object narrowing without also reporting local UI props, callback payloads, and small internal shapes.
      corpusEvidence: Chaski supplies boundary inline-contract drift in BFF service surfaces and exported hooks/helpers, plus clean controls for local React props and function-type callback payloads. Sudocode remains replication pressure, not enough for blocking promotion.
      realCorpusInventory: docs/real-corpus-validation.md records Chaski drift at `scenarios-service.ts` with 15 current findings, plus local UI/callback clean controls after local UI/callback exclusions.
      realCorpusInventoryRefs:
        - docs/real-corpus-validation.md
        - docs/rule-roadmap.md
        - docs/rule-status-registry.md
        - docs/rule-equivalence-audit.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: Interface/type-call signatures, return-type object literals, and exported JSX-returning functions are outside the current implementation-parameter proof.
      productionConcerns: Keep default-off until independent repo replication proves exported/boundary inline object contracts and local UI prop/callback clean controls outside Chaski.
      noSinkBehavior: This rule emits no semantic facts; diagnostics depend only on local AST boundary shape.
      noDeadWorkBehavior: Named parameter contracts, local unexported helpers, JSX-returning React components, local React props, callback payload types, and non-parameter object literals stay clean.
    referenceDoc: docs/rule-roadmap.md
    corpusRepositories: [chaski, sudocode-main]
    concerns:
      - Local UI props and callback payloads require careful exclusions.
    external:
      state: partial-overlap
      support: medium
      candidates: ["ESLint no-restricted-syntax"]
      decision: own-antidrift
      whyThisState: "Core selectors can find inline type literals, but the custom rule narrows the violation to exported non-JSX functions, exported-class methods, and boundary object methods."
      whyNotOtherState: "Not equivalent because a raw syntax ban would report legitimate local props, callbacks, and small internal shapes."
    examples:
      flags:
        - "export function load(input: { userId: string }) {}"
      allows:
        - "export function load(input: LoadInput) {}"
    nextAction: Keep default-off inventory until independent repo replication proves exported/boundary inline structural contracts beyond the current Chaski-only evidence.
  antidrift/no-nullable-positional-tuple:
    status: ready
    stable: false
    signal: deterministic AST
    solveType: type-contract-shape
    proofBuckets: [local-ast-source-shape, semantic-source-type-provenance]
    promotion:
      proofBucket: local-ast-source-shape
      association: Tuple element positions to direct optional/nullish syntax, or to TypeChecker-resolved nullable aliases when parser services are available.
      blockingThreshold: A tuple type reports only when two or more tuple slots are optional, directly nullish, or TypeChecker-resolved to include null or undefined.
      ecosystemComparison: No maintained TypeScript ESLint rule covers the narrow smell of multi-slot nullable positional tuples without banning ordinary tuple use.
      corpusEvidence: Chaski supplies one real drift, `CustomRange = [Date | null, Date | null]`, plus one clean control for a non-null numeric coordinate pair.
      realCorpusInventory: "docs/rule-investigations/no-nullable-positional-tuple.md records the documented broad Chaski frontend inventory count: one finding across 1,533 files. No saved report artifact is currently checked in for this count."
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-nullable-positional-tuple.md
        - docs/rule-roadmap.md
        - docs/rule-status-registry.md
        - docs/real-corpus-validation.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: Alias and generic-chain nullability are missed without TypeScript parser services; imported owner range aliases are intentionally out of scope unless redeclared as local tuple syntax.
      productionConcerns: Evidence is precise but low-yield and Chaski-only. Keep default-off until another real nullable or optional multi-slot tuple appears with real-corpus clean controls for ordinary tuples, hook tuples, imported owner aliases, arrays, whole-null tuple values, and intentionally positional protocol/API tuples.
      noSinkBehavior: This rule emits no semantic facts; diagnostics depend on local tuple syntax and optional TypeChecker alias resolution, not sink availability.
      noDeadWorkBehavior: The current corpus proves non-null coordinate pairs stay clean; hook-style tuples with only one nullable slot, imported owner tuple aliases, arrays, and whole-null tuple values are implementation/case-matrix boundaries that still need real-corpus clean pressure before promotion.
    referenceDoc: docs/rule-investigations/no-nullable-positional-tuple.md
    corpusRepositories: [chaski]
    concerns:
      - The rule intentionally requires at least two nullable or optional tuple slots; one nullable slot in a hook-style tuple stays clean.
      - Type alias and generic-chain nullability are resolved only when TypeScript parser services are available.
      - Imported owner aliases such as date-picker range types stay outside the rule unless they are redeclared as local tuple syntax.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported rule was found for the narrower smell of positional tuples with multiple nullable or optional slots."
      whyNotOtherState: "Not equivalent to tuple bans because ordinary coordinate or hook-style tuples should remain clean."
    examples:
      flags:
        - "type CustomRange = [Date | null, Date | null];"
      allows:
        - "type Point = [number, number];"
    nextAction: Keep default-off inventory while seeking another real nullable positional tuple and clean tuple-control replication before blocking promotion.
  antidrift/react-max-component-props:
    status: ready
    stable: false
    signal: TypeChecker plus JSX-return component proof
    solveType: react-component-api-shape
    proofBuckets: [semantic-source-type-provenance, local-ast-source-shape]
    promotion:
      proofBucket: semantic-source-type-provenance
      association: TypeChecker-resolved first props parameter or React FC type argument to a JSX-returning React component's accepted API.
      blockingThreshold: A JSX-returning component reports when locally-owned prop symbols exceed the configured max. The shared config sets max to 12.
      ecosystemComparison: React JSX max-props-per-line rules cover call-site formatting, @eslint-react/no-unused-props covers unused prop definitions, ESLint max-params and Sonar S107 cover positional parameters, and Vue/Oxlint expose Vue max-props. No maintained React rule was found for accepted props per component.
      corpusEvidence: Chaski MobileFlightTrackerMap reports 31 locally-owned accepted props under the max 12 threshold; regression fixtures cover referenced Props, destructured props, React FC annotations, memo wrappers, DOM prop inheritance, and pass-through wrappers.
      realCorpusInventory: docs/rule-investigations/react-max-component-props.md and tooling/antidrift/src/policy/chaski-corpus.mjs record the first real drift anchor, rule shape, ecosystem search, and clean controls.
      realCorpusInventoryRefs:
        - docs/rule-investigations/react-max-component-props.md
        - tooling/antidrift/src/policy/chaski-corpus.mjs
      replicationsNotIntroducedForTest: false
      knownFalsePositives: 0
      knownFalseNegatives: Class components, PropTypes-only contracts, aliased component type names beyond FC/FunctionComponent, and some higher-order component factories are outside the first proof.
      productionConcerns: Threshold needs real React corpus review, especially design-system, generated, schema/form, and pass-through component APIs.
      noSinkBehavior: This rule emits no semantic facts; diagnostics depend on parser services, TypeChecker prop ownership, and JSX-return proof.
      noDeadWorkBehavior: Non-component functions, inherited DOM/React props, and whole-props pass-through wrappers stay clean.
    semanticAdapterStatus:
      status: inline-pending
      reason: The component API TypeChecker proof currently lives inline in the ESLint rule; extract only if more React component API rules reuse the same ownership and JSX-return model.
    referenceDoc: docs/rule-investigations/react-max-component-props.md
    corpusRepositories: [chaski]
    concerns:
      - The rule is enabled in createConfig() because accepted prop count is a deterministic component API budget, not a separate scanner posture.
      - It counts locally-owned prop symbols, so React/DOM library props inherited through ComponentProps or HTML attributes stay clean.
      - Whole-props JSX spread wrappers stay clean to avoid reporting components that preserve another component's public API.
      - Stable promotion needs more real corpus inventory for the max 12 threshold and clean-control review for generated, form/schema, and design-system components.
    external:
      state: net-antidrift
      support: none
      candidates:
        [
          "react/jsx-max-props-per-line",
          "@stylistic/jsx-max-props-per-line",
          "@eslint-react/no-unused-props",
          "ESLint max-params",
          "Sonar typescript:S107",
          "vue/max-props",
          "oxlint vue/max-props",
        ]
      decision: own-antidrift
      whyThisState: "The maintained React rules found either format JSX attributes, find unused props, or count positional parameters rather than counting a component's accepted props object."
      whyNotOtherState: "Not ecosystem-covered because exact max-props support was found for Vue, not React."
    examples:
      flags:
        - "function Panel(props: PanelProps) { return <section />; } // when PanelProps has more than the configured max locally-owned props"
      allows:
        - "function load(input: LoaderInput) { return input.id; }"
        - 'type ButtonProps = ComponentProps<"button"> & { tone?: Tone; size?: Size };'
        - "function Wrapper(props: BaseProps) { return <Base {...props} />; }"
    nextAction: Run real-corpus inventory for threshold calibration and revisit stable promotion after class/PropTypes/HOC false-negative decisions are explicit.
  antidrift/no-raw-fetch-in-component:
    status: ready
    stable: false
    defaultOff: true
    signal: JSX-return lexical function frame plus scope-bound global fetch
    solveType: side-effect-boundary
    proofBuckets: [local-ast-source-shape]
    promotion:
      proofBucket: local-ast-source-shape
      association: JSX-return proof on a component lexical frame to unshadowed global fetch, globalThis.fetch, window.fetch, or self.fetch calls inside that frame or nested callbacks/helpers declared in it.
      blockingThreshold: Scope-bound raw fetch calls under a JSX-returning lexical component frame report; module-scope helpers, PascalCase-only functions, and local/imported fetch lookalikes stay clean.
      ecosystemComparison: Generated no-restricted-syntax/no-restricted-globals selectors can ban fetch in broad globs, and @eslint-react/web-api-no-leaked-fetch covers abort cleanup for effect fetches, but neither proves raw transport ownership in a JSX-returning lexical component frame.
      corpusEvidence: Chaski and Codebase Atlas provide narrowed fetch-specific drift; Chaski, Sudocode, and Murderbox provide clean component/helper/API-boundary controls.
      realCorpusInventory: docs/rule-investigations/no-raw-fetch-in-component.md and docs/stable-promotion-inventory.md record narrowed drift in Chaski and Codebase Atlas, plus clean controls from Chaski, Sudocode, Murderbox, and Taskme-era inventory.
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-raw-fetch-in-component.md
        - docs/stable-promotion-inventory.md
      claudeAdvisoryReview: docs/rule-investigations/no-raw-fetch-in-component.md records the prior scope review; the June 17 narrowing supersedes any stable-promotion clearance and requires a fresh narrowed inventory before blocking.
      claudeAdvisoryReviewRefs:
        - docs/rule-investigations/no-raw-fetch-in-component.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: JSX-free component returns, aliased fetch calls, and module-scope helper calls from components are outside the narrowed enforcement proof.
      productionConcerns: Narrowed on June 17, 2026 to remove file-extension, PascalCase-only, and JSX-bearing-module helper heuristics.
      noSinkBehavior: This rule emits no semantic facts; diagnostics do not depend on an optional fact sink.
      noDeadWorkBehavior: Helper-level fetches, lower-case utilities in TSX modules, local/imported fetch lookalikes, and hook/query abstractions stay clean, so the rule does not force wrapping already-owned data access.
    referenceDoc: docs/rule-investigations/no-raw-fetch-in-component.md
    corpusRepositories: [chaski, codebase-atlas, sudocode-main, murderbox]
    concerns:
      - Scope decision resolved on June 4, 2026; keep this rule fetch-specific and put broader raw transport ownership in a separate registry-backed rule if real non-fetch drift justifies it.
      - Enforcement now requires JSX-return proof in the lexical component frame. File extension, PascalCase names, and JSX elsewhere in the module are not component proof.
      - The rule models unshadowed global fetch, globalThis.fetch, window.fetch, and self.fetch. Aliased or destructured fetch is out of scope until real corpus evidence appears.
    external:
      state: partial-overlap
      support: high
      candidates:
        [
          "ESLint no-restricted-syntax",
          "ESLint no-restricted-globals",
          "@eslint-react/web-api-no-leaked-fetch",
        ]
      decision: own-antidrift
      whyThisState: "Configured ESLint rules can ban fetch broadly, and @eslint-react can enforce AbortController cleanup for effect fetches."
      whyNotOtherState: "Not ecosystem-covered because broad bans lose JSX-returning lexical component context and @eslint-react/no-leaked-fetch accepts abort-safe raw fetches rather than enforcing API-client/resource ownership."
    examples:
      flags:
        - 'function Orders() { fetch("/api/orders"); return <div />; }'
        - 'function Orders() { globalThis.fetch("/api/orders"); return <div />; }'
      allows:
        - 'async function loadOrders() { return fetch("/api/orders"); }'
        - "async function downloadQrCode(url) { return fetch(url); } function QrActionCard() { return <button />; }"
        - 'import { fetch } from "./api"; function Orders() { fetch("/api/orders"); return <div />; }'
        - "function Orders() { const { data } = useOrders(); return <div>{data.length}</div>; }"
    nextAction: Keep default-off inventory while re-inventorying real component fetch findings under the narrowed same-frame JSX-return proof before restoring blocking severity.
  antidrift/no-redundant-zod-parse:
    status: ready
    stable: false
    defaultOff: true
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/no-redundant-zod-parse.md
    signal: Canonical-path schema provenance from local AST and scope bindings
    solveType: validation-boundary-drift
    corpusRepositories: [chaski, codebase-atlas, murderbox, dust, eliza, hyperdx, intown, streamlens, ts-rest]
    concerns:
      - "Migrated to the Oxlint syntax tier on 2026-08-13. Detection is canonical-path provenance over scope bindings instead of TypeChecker symbol identity, so the shipped surface is new code against a new engine and returns to default-off inventory until a fresh real-corpus inventory replaces the pre-migration one."
      - "Schema-ness of the receiver is decided without types. Positive evidence is either an in-file resolution to a zod-rooted expression or an import whose module is not a known non-schema parser; globals and node: builtins never pass. The residual false-positive shape is a same-file double parse through a first-party non-schema module member, which the nonSchemaModules option exists to silence."
      - "Test assertion scope is decided: Zod parses inside throw assertion callbacks are schema-contract checks, not validation-boundary drift."
      - "Call-result type-equivalence branches were removed on 2026-08-10 and must not return: bidirectional assignability between a helper's declared return type and the schema output never proves that schema validated the value, because refinements (.min, .positive, .refine, .transform) are invisible to TypeScript."
      - "Known holes accepted rather than solved: a path segment backed by a getter that returns a fresh object per read, and cross-module mutation of an exported contract object. Both need module-graph facts the syntax tier does not have."
    unproven:
      - "Measured false negative: murderbox apps/desktop/src/bridge.ts:23 re-parses a value the same schema produced, but the two receivers root at different import bindings from one module, so proving they name one object needs facts outside the file. A same-module-specifier relaxation was implemented and measured (one finding, the anchor, zero new false positives across seven trees) and rejected as unsound: two different exports of one module would falsely unify."
      - "Real-corpus validation on 2026-08-13 measured zero findings and zero false positives across roughly 7,563 parse-family call sites in seven trees. Recall against the canonical-path engine is therefore unproven, which is why the rule ships default-off."
      - "Cross-owner reporting for a generated mirror of a canonical contract is not implemented. Canonical paths are never unified across module boundaries by inference; a registry-gated cross-owner message remains follow-up work."
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported Zod rule tracks schema provenance and reports re-parsing a value already produced by the same schema. The two public rules sharing this name are type-shape detectors, which is the mechanism this package retired in a093871."
      whyNotOtherState: "Not partial-overlap because generic unsafe-assignment rules do not distinguish raw input from schema-owned output, and no public rule resolves a schema reached through a contract-object path."
    examples:
      flags:
        - "const row = RowSchema.parse(raw); return RowSchema.parse(row);"
        - "const post = contract.getPost.responses[200].parse(raw); return contract.getPost.responses[200].parse(post);"
        - "const result = S.safeParse(raw); if (result.success) return S.parse(result.data);"
      allows:
        - "const row = RowSchema.parse(raw);"
        - "const row = RowSchema.parse(await getTypedRow());"
        - "const value = schemas[kind].parse(raw); return schemas[kind].parse(value);"
        - "const doc = YAML.parse(raw); return YAML.parse(doc);"
        - "expect(() => RowSchema.parse(typedFixture)).not.toThrow();"
    nextAction: "Default-off inventory on first release under the graduated rollout doctrine. Restore blocking severity only after a real-corpus inventory measured against the canonical-path engine, not the retired TypeChecker one. Do not reintroduce any type-identity or assignability signal."
  antidrift/no-parse-as-cast:
    status: ready
    stable: false
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-investigations/no-parse-as-cast.md
    signal: TypeChecker plus schema-derivation provenance from the parameter's declared type alias
    solveType: validation-boundary-drift
    corpusRepositories: [murderbox, codebase-atlas]
    concerns:
      - "Structural type identity was rejected as the signal: a first pass keyed on mutual assignability produced three false positives in Codebase Atlas because Zod refinements (.min, .int, .strict) and z.input contracts are invisible to TypeScript. The shipped rule requires the parameter type to be a z.infer/z.output alias of the same schema symbol."
      - "The Codebase Atlas class (validateSpine/markGeneratedStateManifestValidated: a parameter typed as the schema output, immediately parsed, with *Input naming that says the authors meant it defensively) is accepted as drift, not defensive practice. The remedy is to type the parameter as the unvalidated input so the parse is honest. Decision recorded 2026-08-03."
      - "Test contract oracles are not yet exempted. sceneContractOracle.test.ts:53 re-parses a typed value to assert an adapter emits schema-valid output; the throw-assertion-callback exemption does not cover a bare parse in a test body."
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported rule resolves a parameter's declared type back to the Zod schema it was derived from; @typescript-eslint/no-unnecessary-type-assertion covers redundant assertions, not parses that re-establish a contract the caller already satisfied."
      whyNotOtherState: "Not ecosystem-covered because the check needs schema-derivation provenance across module boundaries, which no generic type-safety rule models."
    examples:
      flags:
        - "type User = z.infer<typeof UserSchema>; function save(user: User) { return UserSchema.parse(user); }"
      allows:
        - "function save(user: unknown) { return UserSchema.parse(user); }"
        - "type AstFactsInput = z.input<typeof AstFactsSchema>; function run(facts: AstFactsInput) { return AstFactsSchema.parse(facts); }"
        - "function validateProjectId(id: string) { return z.string().min(1).parse(id); }"
    nextAction: "Test-context exemption landed 2026-08-03: files matching the taxonomy test pattern are skipped, closing the sceneContractOracle.test.ts false positive; known false positives now zero. Next: promotion block for stable: true. Corpus is 10 positives across Murderbox desktop (6) and Codebase Atlas (4 accepted-drift), zero known FPs."
  antidrift/no-appeasement-erasure:
    status: ready
    stable: false
    proofBuckets: [semantic-source-type-provenance]
    semanticAdapterStatus:
      status: inline-pending
      reason: Declared-vs-inferred type comparison and reference-consumer scanning live inline with one consumer. The schema-derivation trace was extracted to semantic-adapters/schema-provenance.mjs on 2026-08-03; extract these too when a second rule needs them.
    referenceDoc: docs/rule-investigations/no-appeasement-erasure.md
    signal: TypeChecker comparison of a declared unknown against the initializer's inferred type, plus scope-resolved evidence that a contract is re-established from the erased binding
    solveType: validation-boundary-drift
    corpusRepositories: [murderbox, cloudflare-agents, codebase-atlas, executor]
    concerns:
      - "This is the upstream gate for the rest of the contract family. In Murderbox desktop apps/desktop, no-redundant-zod-parse, no-appeasement-cast, no-contract-appeasement-projection, no-unsafe-deserialize, and no-defensive-shape-probing all report zero across 38 files while bridge.ts alone holds 21 parse calls; the erased bindings declare unknown, so no type comparison can fire. Measured 2026-08-03 on branch desktop-erasure-remediation: removing the twelve annotations took no-redundant-zod-parse from 0 to 8 findings (six bridge.ts, two machine-workflows.ts) with no rule changes; the other four rules stayed at zero, so the erasures were masking redundant parses specifically."
      - "Scope is erasure plus re-establishment (Zod parse or a named-type cast). Bare widening with no downstream contract stays clean because widening to force later narrowing is legitimate. Passing an erased binding to a parameter with a named contract is a known false negative, not yet implemented."
      - "The 12 Murderbox positives include erasures of `boolean` (bridge.ts:151) and `string | null` (bridge.ts:100), which is why this reads as a uniform edge reflex rather than deliberate defensive validation of complex payloads."
      - "Cast-shaped escape hatches are rare in the anchor repo (2 `as unknown`, 0 `as any` across src), so the annotation form carries the evidence. The `as unknown` branch is fixture-backed but has no real-corpus anchor yet."
      - "Only const bindings are reported. A reassigned binding is a traversal cursor rather than a boundary value; the one Executor positive (packages/plugins/openapi/src/sdk/openapi-utils.ts:42) was a `let` walking an untyped OpenAPI document with a guarded Record cast, and narrowing to const removed it."
      - "Empty object and array literal initializers are excluded. The one Cloudflare Agents positive (packages/agents/src/index.ts:963, `const DEFAULT_STATE = {} as unknown`) is a sentinel placeholder for a generic State default, compared by identity and cast per-use; an empty literal carries no contract, so widening it discards nothing."
      - "Zero findings in a repository is not yet evidence of clean code. Executor, PowerSync Service, and Agent Browser were swept and returned zero, but they carry 5, 1, and 0 zod-importing files respectively, so the parse branch cannot fire there by construction and they are excluded from corpusRepositories. Only Cloudflare Agents (76 zod-importing files, 371 candidates, 0 findings) and Codebase Atlas (17 zod files, 34 candidates, 0 findings) are real clean controls."
      - "Effect Schema decode branch landed 2026-08-03: curried Schema.decode*/decodeUnknown* applications resolved to the effect package now count as contract re-establishment. Executor re-swept with the branch active: 0 findings across 342 candidate files and 168 decode sites, so its zero is now evidence rather than blindness, and executor rejoins corpusRepositories as a clean control. Pre-built decoder bindings (const dec = Schema.decodeUnknownSync(S); dec(value)) are a recorded false-negative slice, unimplemented until a real anchor appears."
      - "The `as unknown as T` double cast is unmatched by this rule family but is not unmatched overall: typescript/no-unsafe-type-assertion reports it, and is enabled at error in oxlint.config.mts. The 53 Executor and 89 Cloudflare Agents sites are unreported in those repositories because they do not run this configuration, not because the stack lacks a rule. Do not build a custom double-cast rule; delegate."
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "Partial overlap, split by branch. The parse branch is net-antidrift: no supported rule compares a declared unknown against the checker's inferred type for the initializer and then asks whether a schema re-establishes the contract. @typescript-eslint/no-unsafe-assignment and no-unsafe-argument police any flowing outward, which is the opposite direction."
      whyNotOtherState: "Not net-antidrift overall, because the named-cast branch is ecosystem-covered wherever typescript/no-unsafe-type-assertion is enabled. That rule reports `const result: unknown = getSnapshot(); result as Snapshot` and the `value as unknown as T` double cast, while correctly ignoring the pure widening `value as unknown`. It does not report the parse branch. Verified 2026-08-03. Scope caveat: that rule is enabled in this repository's own oxlint.config.mts and is NOT part of the shipped oxlint-config, which exports only antidriftComplexityRules and createGovernanceOxlintConfig. Consumers therefore do not inherit it, so the cast branch is load-bearing for them and only redundant here."
    examples:
      flags:
        - "const result: unknown = auth.getAuthSnapshot(); return resultSchema.parse(result);"
        - "const result = getSnapshot() as unknown; return result as AuthSnapshot;"
      allows:
        - "const raw: unknown = JSON.parse(text); return schema.parse(raw);"
        - "const value: unknown = buildProbe(); return typeof value === 'object';"
    nextAction: "Enabled at warn severity on 2026-08-03 by owner decision: zero known false positives across 405 candidate files in two independent zod-bearing repositories, with the gap being a second repository carrying positives rather than any correctness doubt. Warn keeps it visible on new code without blocking builds. Escalation to error needs the post-remediation family measurement plus that second positive-bearing repository."
