        - "function isApiError(error: unknown): error is ApiError { return error instanceof ApiError; }"
        - 'const isConflictError = (value: unknown): value is ConflictError => typeof value === "object" && value !== null && "_tag" in value && value._tag === "ConflictError" && "message" in value && typeof value.message === "string";'
