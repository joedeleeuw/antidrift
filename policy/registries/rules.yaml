        - "export function receive(input: Record<string, any>) {}"
        - "export const headers: { [key: string]: any } = {};"
      allows:
        - "export function receive(input: Message) {}"
        - "export function decode(input: Record<string, unknown>) {}"
        - "function internal(input: Record<string, any>) {}"
    nextAction: Keep the 18-of-20 measurement in the investigation document. Review hidden implementation annotations and nested generic constraints.

  antidrift/no-wrapping-functions:
    directive: G10
    status: ready
    stable: false
    defaultOff: false
    signal: Portable AST candidates verified by executing the inline at every reference in the TypeScript program
    solveType: no-wrapping-functions
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/no-wrapping-functions.md
    corpusRepositories: [private-app-2, private-app-4]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 2,256 hits in 52 repositories, 9/18 on the first frozen sample once an artifact-snapshot hit and a semgrep test input are removed. A narrowing to calls that forward only the function's own parameters (1,118 hits, a fresh sample 12/20) was reverted: it dropped partial applications and thunks over module values, which the directive names as hops and the frozen labels marked true. A fresh sample of the rule as it stands measured 7/20. False positives are handlers and listeners that bind a value or need a stable identity, accessors over module-owned state, functions that own a format, message or predicate, and a framework-required export. Below the 70% bar."
      - "Two stages (October 13, 2026): the portable syntax rule supplies candidates, including composed calls and bound literals; the typed ESLint rule inlines each candidate in memory at every reference, applies the owner table (contracts, identity references, package entry exports resolved per entry through the declared build, literals bound across two or more modules), checks argument order and duplication, call-site type identity and binding identity, re-checks only the edited files, and reports only verified hops."
      - "Fresh measurement on commit db1443d over every tracked TypeScript file in 59 repositories, skipping only files that declare themselves generated: 13,045 stage-1 candidates, 4,584 verified hops in 51 repositories and 881 incomplete-analysis diagnostics; a capped sample of 30 scored 29/30 with 18 repositories at 70% or better. The false report is the read hook of a module-private React context. Earlier rounds are superseded."
      - The Oxlint preset does not run the syntax stage, because Oxlint has no types and its report would restore the false positives the typed stage rejects.
    external:
      state: net-antidrift
      support: none
      candidates:
        [eslint/no-useless-call, unicorn/prefer-native-coercion-functions]
      decision: own-antidrift
      whyThisState: Adjacent ecosystem rules do not report general named delegation functions.
      whyNotOtherState: The owner explicitly chose a named-delegation style policy on September 8, 2026; this does not revive the retired typed-return rule.
    examples:
      flags:
        - "export function useMachines() { return useQuery(api.machines.list, {}); }"
        - "export const loadItems = (id) => owner.load(id);"
      allows:
        - "const area = (radius) => Math.PI * radius ** 2;"
        - "button.onClick(() => owner.load(id));"
    nextAction: Keep the typed stage at error in the typed preset. Known gaps are unexported closures kept only as compile-time type tests, inlines that must export module-private state, module mocks that replace an export by name, and fixtures whose module identity a test asserts.

  antidrift/no-pass-through-parameters:
    status: ready
    stable: false
    defaultOff: false
    directive: G22
    signal: ESLint scope analysis of every parameter reference plus first-party callee resolution
    solveType: no-pass-through-parameters
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories:
      [
        private-app-2,
        opencode,
        executor,
        private-app-4,
        sudocode-main,
        pierre,
        hunk,
        private-app-5,
      ]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 10,238 hits in 64 repositories (paseo 2,033, sentry 1,662), 17/20 true across 17 repositories. False positives: a registry render callback whose signature the interface fixes, a seed for the function's own retry closure, and an internal token consumed by an assertion guard."
      - Runs in the ESLint pass so existing debt is pinned in eslint-suppressions.json; Oxlint has no baseline.
      - Only same-module functions, classes and components, relative or root-alias imports, and `this` methods count as layers, so library calls and intrinsic JSX elements are consumption, not forwarding.
      - A forwarding call must be discarded or returned; a helper whose result this function uses counts as a read.
    external:
      state: net-antidrift
      support: none
      candidates: [eslint/no-unused-vars, react/no-unused-prop-types]
      decision: own-antidrift
      whyThisState: Ecosystem rules report unused bindings; none reports a binding whose only uses forward it to another layer.
      whyNotOtherState: Ousterhout's pass-through variable needs every reference classified, which no maintained rule does.
    examples:
      flags:
        - "import { queryEvents } from './events'; export function listEvents(db, filter) { if (!filter.kind) return []; return queryEvents(db, filter); }"
        - "import { Button } from './button'; export function IconButton({ icon, ...rest }) { return <Button {...rest}>{icon}</Button>; }"
      allows:
        - "function Badge({ label, ...rest }) { return <span {...rest}>{label}</span>; }"
        - "import { write } from './review'; useMutation({ mutationFn: (input) => write(input) });"
    nextAction: Keep at error with the suppressions ratchet; prune suppressions as pass-through debt is removed.

  antidrift/no-vague-names:
    status: ready
    stable: false
    defaultOff: true
    directive: G21
    signal: Deterministic AST over declared binding names
    solveType: no-vague-names
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories:
      [
        private-app-2,
        opencode,
        executor,
        private-app-4,
        sudocode-main,
        agent-browser,
        private-app-5,
      ]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 111,219 hits in 76 repositories (sentry 26,380), 19/20 true once the first sample's five analyzer, mock and synthetic fixture inputs are replaced by unseen eligible hits (14/15 plus 5/5), holding in 17 of 18 sampled repositories. The remaining false positive is a component props variable."
      - Runs in the ESLint pass so existing debt is pinned in eslint-suppressions.json; Oxlint has no baseline.
      - The first `props` parameter of a component or JSX-returning function is React's defined role and stays allowed.
      - A `ctx` whose declared or inferred type is named `*Ctx` or `*Context` is the framework's own vocabulary and stays allowed; two Convex modules in a private app went from 54 hits (41 `ctx`) to 13 with none left.
      - Imports, property keys and type names are not declarations this rule owns.
      - "Off by default by owner decision (October 2026): on 20 fresh hits from the four public repositories, judged by whether a reviewer would ask for the rename rather than by the G21 list, 1 was a real problem. Names that a type annotation, a mirrored domain field, a tiny scope or an idiom (comparator a/b, req/res) already explain made up most of the rest."
    external:
      state: partial-overlap
      support: high
      candidates:
        [unicorn/prevent-abbreviations, eslint/id-denylist, eslint/id-length]
      decision: own-antidrift
      whyThisState: The category list matches the G21 vague-name rule in a private configuration repository, including a curated subset of unicorn prevent-abbreviations keys that are vague in any context.
      whyNotOtherState: No single maintained rule covers the directive's categories, and Oxlint does not host unicorn prevent-abbreviations.
    examples:
      flags:
        - "const data = load();"
        - "try { run(); } catch (e) { report(e); }"
        - "const userData = load();"
      allows:
        - "const invoices = load();"
        - "function Profile(props) { return <div>{props.name}</div>; }"
        - "for (let i = 0; i < n; i += 1) {}"
    nextAction: Off by default; enable explicitly where the G21 list is the project's policy. Change the category list only together with the G21 vague-name rule it mirrors in a private configuration repository.

  antidrift/no-compat-names:
    status: ready
    stable: false
    defaultOff: false
    directive: G5
    signal: Deterministic AST over declared names, matching the declaration contexts of the G5 compat-identifier rule in a private configuration repository
    solveType: no-compat-names
