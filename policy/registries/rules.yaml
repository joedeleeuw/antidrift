        - 'import type { TouchableOpacityProps } from "react-native";'
    nextAction: "Enabled at error in the ESLint pass and baselined in eslint-suppressions.json (antidrift has 0 findings). A second local corpus reports 222 raw touchable imports in 6 React Native repositories (paseo 123, a private app 82); each repository registers its shared Touchable as the exact owner. Retire in favor of generated no-restricted-imports if the custom ownership delta disappears."
  antidrift/no-raw-fetch-in-component:
