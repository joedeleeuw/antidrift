  antidrift/no-sentinel-absence-fallback:
    status: ready
    stable: false
    defaultOff: true
    signal: AST nullish coalescing of a member read to an in-band absence sentinel string
    solveType: absence-sentinel-coercion
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/no-sentinel-absence-fallback.md
    corpusRepositories: [murderbox]
    concerns:
      - "Only the ?? operator is in scope; || falsy coercion of a member read to a sentinel is a different doctrine and stays out."
      - "Numeric sentinels such as Number(props.ExecMainStatus ?? 0) stay silent: proving drift there needs property-name semantics (systemd exit code 0 meaning success), and name-trust is rejected."
      - "Call-expression and plain-identifier left-hand sides stay silent: the murderbox corpus shows display-only fallbacks like score ?? \"unknown\" and branch ?? \"unknown\" on locals whose provenance is not visible at the expression."
      - "Debug and diagnostics display surfaces (apps/client/app/runtime-diagnostics.tsx, apps/client/app/_debug.tsx) flag on member reads of optional runtime data; measure that pressure before any default-on consideration."
