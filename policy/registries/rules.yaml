      - "Off by default by owner decision (October 2026): 10 of 20 fresh sampled warnings were real problems, all tests that read the repository's source as text and pin a fragment of it. The rest were tests reading back files the test itself wrote (6), must-not-contain checks (2) and pinned public type names (2)."
      - Without configured state modules the rule still reports assertions on file contents a test reads with readFile or readFileSync; listing the repository's own state modules in options adds imported repo state.
      - Taint follows imports, aliases, and a small set of expression forms; dynamic property access, re-export indirection, or values routed through helper functions can hide a mirror.
    external:
      state: net-antidrift
      support: low
      candidates:
        [
          "ESLint no-restricted-imports",
          "eslint-plugin-jest no-conditional-expect",
          "SonarQube duplicated-literal detection",
        ]
      decision: own-antidrift
      whyThisState: "No ecosystem rule relates an imported repo-owned state module to the literal values an assertion compares it against; import-restriction and duplicated-literal rules do not model the mirrored-state signal."
      whyNotOtherState: "Not ecosystem-covered because the signal depends on taint from configured repo-owned modules, which no upstream test rule tracks."
    examples:
      flags:
        - 'import { getChatProfileManifest } from "../lib/server/conf"; expect(getChatProfileManifest()).toEqual([{ id: "alpha", confFile: "model-alpha.conf", scope: "switchable" }]);'
        - 'import { getChatProfileConf } from "../lib/server/conf"; expect(getChatProfileConf("retired-id")).toBeNull();'
      allows:
        - 'import { getChatProfileManifest } from "../lib/server/conf"; expect(getChatProfileManifest().length).toBeGreaterThan(0);'
        - 'import { getChatRuntimeProfiles, getChatProfileManifest } from "../lib/server/conf"; expect(getChatRuntimeProfiles().map((p) => p.id)).toEqual(getChatProfileManifest().map((e) => e.id));'
    nextAction: "Off by default; enable explicitly. Limiting it to tests that read the repository's own source is the candidate fix before default-on."

  antidrift/no-service-constructor-imports:
    status: ready
    stable: false
    defaultOff: false
    signal: TypeChecker symbol and module provenance proving a project-local module owns an Effect service tag or layer and exports a raw service constructor imported outside Layer wiring
    solveType: effect-service-composition-boundary
    proofBuckets: [semantic-source-type-provenance]
    semanticAdapterStatus:
      status: inline-pending
      reason: Service contract and Layer wiring provenance live in semantic-adapters/ts-rule-kernel.mjs and are currently consumed by antidrift/no-service-constructor-imports.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
    corpusRepositories: [agent-guardrails-monorepo-template]
    concerns:
      - "Built from scratch on semantic-adapters/ts-rule-kernel.mjs to replace the retired syntax-only anti-slop import: reports only when TypeChecker module provenance proves the target project-local module declares a Context.Tag, Context.GenericTag, Effect.Service, or Layer contract and a non-owner imports its raw constructor or factory outside Layer.* composition."
      - "Plain helper modules that export make* or create* functions without owning a service tag or layer contract stay clean by construction."
      - "Direct Layer.* composition calls (Layer.effect, Layer.succeed, Layer.scoped, Layer.sync, Layer.unwrapEffect, Layer.unwrapScoped) that wire the imported constructor into a layer stay clean."
    external:
      state: net-antidrift
      support: none
      candidates:
        [
          "dmmulroy/anti-slop/no-service-constructor-imports",
          "ESLint no-restricted-imports",
        ]
      decision: own-antidrift
      whyThisState: "Syntax-only import restrictions match make* names indiscriminately; no upstream rule uses TypeChecker module and symbol provenance to verify that the target module actually owns an Effect service tag or layer contract."
      whyNotOtherState: "Not equivalent to anti-slop because anti-slop matched any relative make* import by syntax without checking whether the target module defined a service contract or whether the consumer was wiring a Layer."
    examples:
      flags:
        - 'import { makeUserRepo } from "./user-repo"; const repo = makeUserRepo(); // when ./user-repo declares class UserRepo extends Context.Tag("UserRepo")...'
      allows:
        - 'import { UserRepo, UserRepoLive } from "./user-repo";'
        - 'import { makeUserRepo, UserRepo } from "./user-repo"; export const UserRepoTest = Layer.effect(UserRepo, makeUserRepo());'
        - 'import { makeSlug } from "./slug"; const slug = makeSlug("hello"); // ./slug has no service tag or layer'
    nextAction: "Enabled at error in the TypeScript ESLint pass; promote to stable once independent multi-repo Effect service corpus drift is recorded."

  antidrift/no-first-party-module-mock:
    directive: G15
    status: ready
    stable: false
    defaultOff: false
    signal: TypeScript module resolution, with the linted program's compiler options, of the specifier passed to vi.mock, vi.doMock, jest.mock, jest.doMock, jest.setMock, jest.unstable_mockModule or bun:test mock.module, reporting when the resolved file lies outside node_modules
    solveType: test-quality-first-party-module-mock
    proofBuckets: [semantic-source-type-provenance]
    semanticAdapterStatus:
      status: inline-pending
      reason: Mock-specifier resolution lives in eslint-plugin/rules/no-first-party-module-mock.js and is consumed only by antidrift/no-first-party-module-mock.
    referenceDoc: docs/rule-investigations/no-first-party-module-mock.md
    corpusRepositories: [agent-native, cloudflare-agents, librechat]
    concerns:
      - "Rebuilt from the retired anti-slop no-module-mocking import. Labelled module-mock hits from agent-native, cloudflare/agents and LibreChat: 7 of 9 mocked a first-party module (drift), 2 mocked third-party SDKs (not drift); resolving the specifier separates the two. antidrift/no-nonindependent-test-oracle, named as the replacement when the import was retired, reports nothing in two of the drift files."
      - "Workspace packages linked into node_modules resolve to their real path in the repository and count as first-party; a specifier that does not resolve is not reported."
      - "A partial mock (importOriginal) still replaces the module for every importer and reports."
    external:
      state: net-antidrift
      support: none
      candidates:
        [
          "dmmulroy/anti-slop/no-module-mocking",
          "eslint-plugin-vitest/no-mocks-import",
          "eslint-plugin-jest/no-mocks-import",
        ]
      decision: own-antidrift
      whyThisState: "anti-slop reported every module mock by syntax; the jest and vitest plugins only forbid importing from __mocks__. None resolves the mocked specifier to tell a first-party module from a third-party boundary."
      whyNotOtherState: "Not equivalent to the anti-slop rule, which also reported mocks of third-party SDKs and platform modules, the boundary a test is expected to replace."
    examples:
      flags:
        - 'vi.mock("~/data-provider"); // tsconfig paths resolve it to client/src/data-provider'
        - 'jest.mock("../../src/providers/call-bridge.js", () => ({ CallBridge: jest.fn() }));'
      allows:
        - 'vi.mock("partysocket");'
        - 'vi.mock("node:fs");'
    nextAction: "Enabled at error in the TypeScript ESLint pass; measure precision on fresh labelled hits before stable promotion."

  antidrift/no-bag-reshaper:
    directive: G4
    status: ready
    stable: false
    defaultOff: false
    signal: TypeChecker parameter-bag provenance plus pure object-literal return projection proof covering both bagToContract and bagToBag
    solveType: bag-reshaper-projection
    proofBuckets: [semantic-source-type-provenance]
    semanticAdapterStatus:
      status: inline-pending
      reason: The parameter-bag and object-literal projection proof runs on defineTypeScriptRule in the ESLint rule; extract a standalone semantic adapter once multi-rule sharing requires it.
    referenceDoc: docs/rule-investigations/directive-parity-and-pathological-smells.md
    corpusRepositories: [antidrift]
    concerns:
      - "Covers both bag-reshaping pathologies missed by no-contract-appeasement-projection: bagToContract ('provide a bag, return a type I want', where a function reshapes a parameter bag into a named target contract without validation or domain construction) and bagToBag ('provide a bag, return a bag', where a function repacks, renames, defaults, or coerces fields from an input bag into another ad-hoc object literal)."
      - "Functions that perform real domain computation (method calls, function calls other than primitive String/Number/Boolean coercions, arithmetic, string concatenation, new construction, array literals, or async/await) stay clean."
      - "Envelope constructors that wrap a whole parameter without unpacking its fields (e.g., ok(payload) => ({ ok: true, payload })) and multi-parameter assemblers stay clean."
    external:
      state: net-antidrift
      support: none
      candidates:
        [
          "antfu/eslint-plugin-slop no-trivial-functions",
          "antidrift/no-contract-appeasement-projection",
        ]
      decision: own-antidrift
      whyThisState: "No existing rule proves via TypeChecker that a unary parameter is a plain data bag and that every returned object literal property is a pure field projection, rename, spread, default, or primitive coercion into either a named contract (bagToContract) or an inferred anonymous bag (bagToBag)."
      whyNotOtherState: "Not covered by no-contract-appeasement-projection because that rule skips all returned ObjectLiteralExpressions and requires an explicit return type annotation."
    examples:
      flags:
        - 'function toUserRow(input: { id: string; email: string; name?: string | null }): UserRow { return { id: input.id, email: input.email, name: input.name ?? "Anonymous" }; }'
        - 'function normalizeFilters(params: { teamId: string; status?: string }) { return { team_id: params.teamId, status: params.status ?? "active" }; }'
      allows:
        - "function parseUserRow(raw: unknown): UserRow { return UserRowSchema.parse(raw); }"
        - "function formatUserSummary(user: UserRow) { return { id: user.id, label: user.email.trim().toLowerCase() }; }"
        - "function ok<T>(payload: T) { return { ok: true, payload }; }"
    nextAction: "Enabled at error in the TypeScript ESLint pass; inventory multi-repo bagToContract and bagToBag findings before stable promotion."

  antidrift/no-redeclared-owned-union:
    status: ready
    stable: false
    defaultOff: false
    directive: W4
    signal: Exact AST literal member-set equality between a union and an in-scope exported runtime constant array
    solveType: redeclared-owned-union
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/no-redeclared-owned-union.md
    corpusRepositories: [antidrift]
    concerns:
      - "October 12 2026 precision (79 deduplicated TypeScript roots from two local corpora): 5 hits in 5 repositories (athena-crisis, claude-code, executor, a private app, LibreChat), all labelled, 5/5; each union restates an exported runtime array in the same module."
      - Re-export chains and computed arrays remain unproven; ownership requires a directly inspectable exported constant array.
      - Equal member sets can represent distinct concepts; explicit name exemptions preserve consumer control.
    external:
      state: net-antidrift
      support: low
      candidates: ["@typescript-eslint/no-duplicate-type-constituents"]
      decision: own-antidrift
      whyThisState: "The candidate checks repeated constituents within one union, rather than equality to a runtime array owner."
      whyNotOtherState: "Broader ecosystem coverage remains unverified; the local source-shape proof supports provisional independent ownership."
    examples:
      flags:
        - 'export const PHASES = ["queued", "done"] as const; type Phase = "queued" | "done";'
      allows:
        - 'export const PHASES = ["queued", "done"] as const; type Phase = (typeof PHASES)[number];'
    nextAction: "Enabled at error in the ESLint pass and baselined in eslint-suppressions.json (antidrift has 0 findings). A second local corpus reports 7 findings in 7 repositories."

  antidrift/no-open-dictionary-at-boundary:
    status: ready
    stable: false
    defaultOff: false
    directive: G4
    signal: String-keyed dictionaries of any in exported signatures and variable annotations.
    solveType: open-dictionary-at-boundary
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/no-open-dictionary-at-boundary.md
    corpusRepositories: [antidrift]
    concerns:
      - "Superseded October 12, 2026 study. Before excluding type parameters, 403 hits in 30 repositories scored 11/20. After that change, 356 hits in 29 repositories scored 10/20. Both samples fell below 70%. The current rule checks only dictionaries of any."
      - Unknown values remain unchecked input and stay allowed.
      - Generic constraints and defaults stay allowed.
      - The rule does not expand named types or inferred signatures.
    external:
      state: net-antidrift
      support: low
      candidates:
        [
          "@typescript-eslint/no-restricted-types",
          "@typescript-eslint/no-explicit-any",
        ]
      decision: own-antidrift
