      - 'Wide corpus sweep (54 TypeScript repositories, 26,379 type-checked files): 110 findings in 18 repositories before the evidence change (18 TP / 92 FP, 16%); 25 findings in 6 repositories after it (sentry 11, opencode 6, executor 4, paseo 2, figma-console-mcp 1, pi-smart-compact 1; 18 TP / 7 FP, 72%). Per-repository precision stays uneven (sentry 11/11, opencode 3/6, executor 2/4, paseo 0/2). Remaining false-positive classes: boolean brand helpers such as NamedError.hasName, capability probes on in-process objects (typeof value.safeParse === "function"), a library brand "_zod" in value, a symbol-keyed required field read, and a null filter over an any-typed array.'
      - The verdict layer is heuristic; validator-looking helper names and incidental member reads can cause false negatives.
      - "Tag checks on raw input (October 2026): a literal equality proves a variant only when the value the tag is read from is a closed union to the TypeChecker and the read does not pass through a type assertion. On raw any/unknown/open-record input the asserted payload fields must be checked too. Union targets are checked against the variants the body's tag comparisons accept; reading into a required object field requires that field's required properties; keyed helpers such as hasString(value, 'id') count as checks; a parameter whose declared type does not resolve (error type) is not raw input."
      - "Witnesses the previous version missed: a message guard in a private app (resize message without height) and deep-seek tools/server/webui/src/lib/stores/tools.svelte.ts:67 (function.parameters unchecked)."
      - "October 2026 local corpus (70 roots, 473 predicate files) with resolved dependencies (frozen-lockfile copies of a private app, fungible, sandcastle, another private app, paseo, a third private app and the deep-seek and llama.cpp-rocmfpx web UIs, plus a fourth private app): before 2 findings in 1 repository (1/2); after 10 findings in 5 repositories (paseo 6, a private app 1, deep-seek 1, llama.cpp-rocmfpx 1, another private app 1), 9/10 true positives, every repository at or above 80% (paseo 5/6). The false positive is paseo agent-response-loop.ts:108, a typeof value.safeParse === 'function' capability probe."
