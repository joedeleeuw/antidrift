schemaVersion: 1

promotionRequirements:
  investigation:
    requireReferenceDoc: true
    requireEcosystemCheck: true
    requireClaudeAdvisoryKickoff: true
    notes:
      - Investigation starts with evidence capture, not code.
      - The rule table should point to a reference document for candidate scope, ecosystem coverage, potential solves, and remaining gaps.
      - If an existing ESLint or typescript-eslint rule covers the behavior, mark the candidate ecosystem-covered instead of implementing a custom rule.
  stable:
    minIndependentRepositories: 2
    requireReplicationsNotIntroducedForTest: true
    maxKnownFalsePositives: 0
    maxKnownFalseNegatives: 0
    productionConcerns: none
    requireClaudeAdvisoryReview: true
    requireRealCorpusInventory: true
    notes:
      - Stable promotion is stricter than local readiness.
      - Fixture programs and code added only to satisfy a rule do not count as replications.
      - Claude review is advisory only; repo evidence and validation gates remain authoritative.

claudeAdvisory:
  model: claude-opus-4-8
  promptProtocol: docs/claude-rule-review-protocol.md
  mode: read-only
  outputDirectory: reports

directives:
  G2:
    directive: TS strict; no appeasement casts.
  G3:
    directive: Case tables via satisfies.
  G4:
    directive: Parse at boundaries; no reparsing.
  G5:
    directive: No backwards compatibility.
  G7:
    directive: Fail loudly; no silent default.
  G8:
    directive: Simplest form; no nested ternaries.
  G9:
    directive: Declare the case space first.
  G10:
    directive: Remove single-call hops.
  G11:
    directive: Deep modules; one owner per concern.
  G13:
    directive: No dependency cycles.
  G15:
    directive: No unit tests, mocks or fixtures.
  G21:
    directive: No vague names.
  G22:
    directive: No pass-through variables.
  S1:
    directive: No hash pins of tracked files.
  S4:
    directive: No host-absolute paths.
  S5:
    directive: No dated provenance prose.
  W4:
    directive: Type reuse; no parallel shapes.

semanticFactKinds:
  identitySchemaTransform:
    rules:
      - antidrift/no-identity-schema-transform
    adapterId: typescript-eslint/schema-provenance
    carrier: semantic-adapter
    confidence:
      - deterministic-enforcement
    emission:
      - blocking-diagnostic
    association: Zod transform callbacks to closed schema input shapes and exact object pass-through reconstruction.
    noSinkBehavior: The identity-transform diagnostic still reports; only the serialized semantic fact is skipped.
    payloadFields:
      - diagnostic
      - inputShape
      - outputShape
      - transform
  broadSetterCoMutation:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - heuristic-inventory
    emission:
      - inventory-only
    association: React setter calls to state cells within one function frame.
    noSinkBehavior: No fact is emitted and no diagnostic is produced; broad co-mutation remains non-blocking.
    payloadFields:
      - transition
      - requestGuard
      - setterCount
      - cells
  resourceLifecycleProof:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - deterministic-enforcement
    emission:
      - blocking-diagnostic
    association: React state cells to lifecycle roles through async transition writes, catch-scope error writes, awaited or awaited-member resource assignment, updater invalidation, and request-guard evidence.
    noSinkBehavior: The diagnostic still reports; only the serialized semantic fact is skipped.
    payloadFields:
      - boolCell
      - errorCell
      - payloadCell
      - transition
      - requestGuard
      - setterCount
      - cells
  sourceMemberStateShardCandidate:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - heuristic-inventory
    emission:
      - inventory-only
    association: React state cells to distinct members of one freshly awaited source object as fact-only inventory; no accepted owned-entity enforcement tier currently exists.
    noSinkBehavior: No diagnostic is produced. Without a semantic fact sink, the rule produces no externally visible output.
    payloadFields:
      - source
      - members
      - editableCells
      - transition
      - requestGuard
  structuralMatch:
    rules:
      - antidrift/no-canonical-model-fork
      - antidrift/no-structural-type-fork
    adapterId: typescript-eslint/type-owner
    carrier: authority-registry
    confidence:
      - deterministic-enforcement
      - deterministic-inventory
    emission:
      - blocking-diagnostic
      - inventory-proposal
    association: Local handwritten object contracts to accepted or proposed generated, domain, or package owner types.
    noSinkBehavior: Accepted generated, domain, and package owner diagnostics still report; unaccepted installed-package owner proposals are not collected.
    payloadFields:
      - authorityState
      - diagnostic
      - localType
      - ownerType
      - structuralMatch
  changeContractConformance:
    rules: []
    commandIds:
      - antidrift/change-contract
    adapterId: change-contract
    carrier: change-relative
    confidence:
      - deterministic-inventory
    emission:
      - inventory-only
    association: Merge-base diff surface to a machine-readable change contract.
    noSinkBehavior: The CLI still prints the conformance summary; only the serialized semantic fact is skipped.
    payloadFields:
      - contractState
      - changeContext
      - declaredScope
      - actualChangeSurface
      - violations
      - decision

statuses:
  ready: Implemented, enabled, and backed by at least one real drift and clean assertion under the current local gate.
  under-proven: Implemented, but missing enough real drift or clean evidence to trust promotion.
  false-positive-prone: Implemented, but real corpus evidence or review found an overbroad branch or unstable signal.
  ecosystem-covered: Existing ecosystem rule or plugin covers the behavior well enough; do not implement a custom antidrift rule unless a real gap remains.
  retired: Removed from the active rule surface because real code showed the signal was not deterministic enough.
  research: Not implemented; requires ecosystem review and real corpus evidence before entering scope.

ruleFamilies:
  type-contract-authority:
    description: Rules that decide whether local code has earned the type contract it claims, or should import, infer, validate, narrow, or derive from the owner instead.
    referenceDoc: docs/rule-family-type-contract-authority.md
    subsets:
      contract-appeasement-projection:
        intent: Prevent internal helpers from projecting one source value contract into another explicit return contract without construction or validation.
        rules:
          - antidrift/no-contract-appeasement-projection
        flags:
          - "function fullExcerpt(file: ParsedFile): string { return file.source; }"
          - "const itemId = (item: Item): string => item.id;"
          - 'function actionForEventKind(eventKind: EventKind): MemoryResult["action"] | undefined { if (eventKind === "recall") return eventKind; }'
        allows:
          - "function compactText(file: ParsedFile) { return file.source.trim(); }"
          - "export function selectSource(file: ParsedFile): string { return file.source; }"
          - "const action = ActionSchema.parse(raw);"
      inferred-local-return-ownership:
        intent: Remove a nested implementation return annotation only when exact inference and an independently declared enclosing return contract both preserve type ownership.
        rules:
          - antidrift/no-redundant-local-return-type
        flags:
          - "function selectedData(): Record<Id, Selection> { const toSelection = (id: Id): Selection => { const selected = configs[0]; return { configs, id, selected }; }; return { default: toSelection('default') }; }"
        allows:
          - "function selectedData() { const toSelection = (id: Id): Selection => { const selected = configs[0]; return { configs, id, selected }; }; return toSelection('default'); }"
          - "function createApi(): Api { const build = (): Result => { return { value }; }; return { build }; } export const api = { createApi };"
      inferred-type-predicate:
        intent: Let TypeScript infer a callback's type predicate from its single native check instead of restating it as an unchecked assertion.
        rules:
          - antidrift/no-redundant-type-predicate
        flags:
          - "rows.filter((row): row is Row => row !== null);"
          - 'items.filter((item): item is TextItem => item.kind === "text");'
        allows:
          - "rows.filter((row) => row !== null);"
          - "export function isRow(value: Row | null): value is Row { return value !== null; }"
      type-escape-casts:
        historical: true
        intent: Prevent casts from manufacturing named, narrowed, or branded contracts without a guard, parser, or brand constructor. typescript/no-unsafe-type-assertion in @joedeleeuw/typescript-tooling owns these casts.
        rules:
          - antidrift/no-appeasement-cast
        flags:
          - "const order = raw as Order;"
          - "const err = caught as AxiosError;"
        allows:
          - "const order = OrderSchema.parse(raw);"
          - "if (isOrder(raw)) return raw;"
          - "const user = currentUser.toJSON() as FirebaseUserJson; // source is a typed SDK value, not any or unknown"
      validation-boundary-provenance:
        intent: Keep raw data parsing at the boundary, and avoid re-certifying values already produced by the same schema.
        rules:
          - antidrift/no-unsafe-deserialize
          - antidrift/no-redundant-zod-parse
          - antidrift/no-same-schema-recertification
        flags:
          - "const input = JSON.parse(rawUnknown);"
          - "const row = RowSchema.parse(await getTypedRow());"
          - "return StateSchema.parse({ ...state, changed });"
          - "const parsed = PayloadSchema.parse(alreadyParsedPayload);"
        allows:
          - "const input = InputSchema.parse(JSON.parse(typedJsonString));"
          - "const row = RowSchema.parse(rawRow);"
          - "return moveTo(StateSchema.parse(nextState));"
          - "expect(() => RowSchema.parse(typedFixture)).not.toThrow();"
      broad-shape-probing:
        intent: Prevent broad-input predicates and normalizers from checking a token shape while claiming a larger object contract.
        rules:
          - antidrift/no-underchecked-type-predicate
          - antidrift/no-defensive-shape-probing
        flags:
          - "z.custom<LineItem>((value) => typeof value === 'object' && value !== null)"
          - "Object.entries(raw as Record<string, unknown>).map(([, value]) => 'numberValue' in value ? value.numberValue : null)"
          - "function isLineItem(value: unknown): value is LineItem { return typeof value === 'object' && value !== null; }"
        allows:
          - "z.custom<DateMessage>((value) => hasNumber(value, 'year') && hasNumber(value, 'month') && hasNumber(value, 'day'))"
          - "Object.entries(typedMap).map(([, value]) => value.name)"
          - "function isString(value: unknown): value is string { return typeof value === 'string'; }"
      contract-shape-duplication:
        intent: Prevent local structural copies or ambiguous positional shapes when a package, generated source, domain owner, or named object contract owns the shape.
        rules:
          - antidrift/no-structural-type-fork
          - antidrift/no-canonical-model-fork
          - antidrift/no-inline-structural-type-at-use-site
          - antidrift/no-restated-dependency-type
          - antidrift/no-unresolved-dependency-types
          - antidrift/no-nullable-positional-tuple
          - antidrift/no-near-duplicate-type
        flags:
          - "type UserFork = { id: string; email: string; status: UserStatus };"
          - "export function load(input: { userId: string }) {}"
          - "type CustomRange = [Date | null, Date | null];"
          - "type LocalUser = Pick<User, 'id' | 'email'> & { status: UserStatus };"
        allows:
          - "import type { User } from '@agent-guardrails/domain';"
          - "export function load(input: LoadInput) {}"
          - "type DateRange = { start: Date | null; end: Date | null };"
          - "type UserDto = z.infer<typeof UserDtoSchema>;"
      typed-delegation-research:
        historical: true
        intent: Preserve retired/disputed wrapper evidence without turning broad single-call delegation into a rule.
        rules:
          - antidrift/no-thin-typed-factory-wrapper
          - antidrift/no-explicit-return-type-private-helper
        flags:
          - "function buildRoute(path: string, title: string): WebviewRoute { return makeRoute(path, title); }"
          - "function routeForUser(userId: UserId): WebviewRoute { return makeUserRoute(userId); }"
        allows:
          - "function renderSprite(id: string): VisualTokenRegistryEntry { return entry(`render.sprite.${id}`, ['render.sprite'], [`sprite.${id}`], 'sprite token'); }"
          - "function mapErrorCode(error: Error): TRPCError['code'] { return error instanceof AuthError ? 'UNAUTHORIZED' : 'INTERNAL_SERVER_ERROR'; }"
          - "export function reloadProject(id: ProjectId): Promise<Project> { return readProject(id); }"

policyRuleReviews:
  react/no-use-state-waterfall:
    status: research
    coverage: Not implemented as a custom or ecosystem rule.
    reason: The smell is plausible, but raw useState count alone is too coarse without real inventory and reducer/resource replacement examples.
    nextAction: Keep out of blocking config until a real program matrix proves a deterministic signal beyond ordinary component complexity.
  react/no-handrolled-resource-lifecycle-cells:
    status: active-custom
    antidriftRule: antidrift/no-handrolled-resource-lifecycle-cells
    coverage: "Implemented as a semantic React state graph rule: deterministic resource-lifecycle proof blocks, while broad multi-setter co-mutation and sourceMemberStateShardCandidate fan-out emit inventory facts only."
    reason: Existing React ecosystem rules do not model coupled setter bindings as one implicit state-machine smell.
    nextAction: Enabled at error for deterministic resource-lifecycle proof; broad co-mutation and source-member fan-out remain classified inventory and do not widen enforcement by themselves.
  react/no-shattered-ingested-entity-state:
    status: merged
    mergedInto: react/no-handrolled-resource-lifecycle-cells
    coverage: Merged into antidrift/no-handrolled-resource-lifecycle-cells, which emits sourceMemberStateShardCandidate semantic facts alongside resourceLifecycleProof and stateSetterCoMutation.
    reason: Both rules share the same per-component React state cell graph and transition pass in semantic-adapters/projection/react-state.ts; keeping a separate no-op rule entry that never emits diagnostics added rule-surface overhead without distinct enforcement.
    nextAction: Keep sourceMemberStateShardCandidate fact emission in antidrift/no-handrolled-resource-lifecycle-cells; do not maintain a separate rule entry.
  react/no-status-triplet-state:
    status: retired
    replacement: antidrift/no-handrolled-resource-lifecycle-cells
    coverage: Retired as a standalone name-group inventory rule; the provable resource-lifecycle subset is enforced by antidrift/no-handrolled-resource-lifecycle-cells through the React state graph adapter.
    reason: Names such as data/loading/error can inventory suspects but cannot prove derivable resource lifecycle drift.
    nextAction: Keep the locked retired custom decision in place; use no-handrolled-resource-lifecycle-cells for semantic AST lifecycle proof.
  react/no-derived-state-effect:
    status: ecosystem-covered
    replacement: react/react-compiler
    coverage: Covered by Oxlint's React Compiler rule through its EffectDerivationsOfState diagnostic.
    reason: The native compiler analysis reports values derived from props or state inside effects; custom code would duplicate that proof.
    nextAction: Keep the native React Compiler rule enabled and retain the behavioral probe in migration evidence.
  react/no-effect-fetch-waterfall:
    status: research
    coverage: Partially pressured by antidrift/no-raw-fetch-in-component, but no separate waterfall rule exists.
    reason: Fetch-in-effect plus loading state overlaps component data-loading architecture and can become framework-specific quickly.
    nextAction: Do not implement until real code proves a gap left after no-raw-fetch-in-component and React hooks rules.
  react/require-effect-deps:
    status: active-custom
    antidriftRule: antidrift/require-effect-deps
    coverage: Implemented as an import-binding custom rule for effect hooks called without a dependency array.
    reason: react-hooks/exhaustive-deps validates an existing dependency array but intentionally does not report the missing-array case.
    nextAction: Stable; monitor intentional every-render disables with required descriptions.
  react/max-component-props:
    status: active-custom
    antidriftRule: antidrift/react-max-component-props
    coverage: Implemented as a type-aware JSX-returning component API rule for locally-owned accepted props.
    reason: React ecosystem rules cover JSX props per line, unused props, and parameter count, but not accepted prop-object cardinality.
    nextAction: Keep enabled at max 12 while collecting real-corpus threshold evidence and clean controls for pass-through/design-system/form components.
  ts/no-contract-appeasement-projection:
    status: active-custom
    antidriftRule: antidrift/no-contract-appeasement-projection
    coverage: Implemented as a type-aware rule for explicit-return internal helpers that only project parameters, parameter members, destructured bindings, matching literal branches, or undefined fallback into the declared return contract.
    reason: This is a net antidrift rule; no maintained rule targets typed contract projection helpers that locally appease a return shape without construction or validation.
    nextAction: Keep the inherited selector-wrapper corpus and add real cross-contract projection corpus before stable promotion.
  ts/no-mechanical-get-x-from-y:
    status: merged
    mergedInto: ts/no-contract-appeasement-projection
    coverage: Former name-shaped concern is subsumed by the type-aware contract projection rule.
    reason: User-chosen names are too gameable when the AST return shape can carry the signal.
    nextAction: Keep as historical policy wording only; do not implement a name-regex rule.
  ts/no-inline-structural-type-at-use-site:
    status: active-custom
    antidriftRule: antidrift/no-inline-structural-type-at-use-site
    coverage: Implemented as a TypeChecker identity rule for boundary-parameter object contracts that repeat a first-party shape; antidrift/no-restated-dependency-type covers declared dependency exports with the same matcher.
    reason: Generic syntax bans are too broad; the custom rule reports only proven repeats of an existing shape.
    nextAction: Keep the boundary scope and the generated-owner exclusion; review new false reports before stable promotion.
  ts/no-nullable-positional-tuple:
    status: active-custom
    antidriftRule: antidrift/no-nullable-positional-tuple
    coverage: Implemented as deterministic AST/type-service detection of tuple types with multiple nullable or optional slots.
    reason: The rule captures ambiguous positional partial state such as CustomRange = [Date | null, Date | null] without banning ordinary tuples.
    nextAction: Seek another real nullable positional tuple and clean tuple-control replication.
  ts/no-underchecked-type-predicate:
    status: active-custom
    antidriftRule: antidrift/no-underchecked-type-predicate
    coverage: Implemented as a TypeChecker-backed broad-input object predicate check.
    reason: Ecosystem exhaustiveness rules do not check whether a predicate has earned the object contract it asserts.
    nextAction: Keep default-off and use policy:inventory-underchecked-predicate to seek real required-field underchecked predicate drift; optional-field sufficiency remains inventory/research.
  arch/no-one-use-helper:
    status: research
    coverage: Not implemented.
    reason: One-use helpers can be fake abstraction, but reference counts and helper size alone produce many legitimate local extraction cases.
    nextAction: Keep out of blocking scope until real programs prove a deterministic rule with clean domain-helper controls.
  arch/no-wrapping-functions:
    directive: G10
    status: active-custom
    antidriftRule: antidrift/no-wrapping-functions
    coverage: Typed ESLint rule at error that reports only engine-verified hops. The Oxlint preset does not run the syntax stage.
    reason: The owner explicitly chose this as a style policy on September 8, 2026. Exporting or naming a wrapper does not exempt it.
    nextAction: Keep enabled by default and preserve actual callback timing and boundary contracts when removing wrappers.
  arch/max-function-lines:
    status: spec-only
    coverage: Not enforced locally as a line-count rule; the shared Oxlint config enforces complexity, depth, and parameter budgets.
    reason: Function length is a blunt proxy for complexity and can duplicate Oxlint budgets and Sonar trend governance without a clear construction pattern.
    nextAction: Keep raw line count out of custom rules unless real corpus evidence justifies a narrower component or function split pattern.
  arch/max-component-lines:
    status: spec-only
    coverage: Not enforced locally as a component line-count rule.
    reason: Component size needs container/view/resource context; raw line count would encourage arbitrary extraction.
    nextAction: Revisit only after React state/resource rules expose a repeatable component split pattern.
  arch/max-module-lines:
    status: ecosystem-covered
    replacement: Oxlint max-lines
    coverage: The shared Oxlint config blocks JavaScript and TypeScript modules over 1,500 lines and counts blank and comment lines.
    reason: Oxlint provides exact maintained local enforcement, so Antidrift owns the configuration and policy mapping rather than a custom rule implementation.
    nextAction: Exclude only generated roots declared by generatedSources and split oversized modules by real responsibility.
  arch/no-high-touch-file-growth:
    status: spec-only
    coverage: Not enforced locally.
    reason: High-touch file growth depends on change history rather than a single source file AST and needs repository analytics.
    nextAction: Keep as architecture review guidance unless a policy script with real git-history evidence is scoped.
  arch/no-cross-layer-import:
    status: ecosystem-covered
    replacement: boundaries/element-types
    coverage: Covered by eslint-plugin-boundaries through Oxlint's JavaScript plugin host with configured layer import directions.
    reason: The maintained boundaries rule already owns this import-graph check.
    nextAction: Keep layer facts in architecture registry/config.
  arch/no-deep-import:
    status: ecosystem-covered
    replacement: boundaries/no-private
    coverage: Covered by eslint-plugin-boundaries through Oxlint's JavaScript plugin host.
    reason: Maintained boundary rules are a better fit than custom path parsing.
    nextAction: Keep public/private entrypoint facts aligned with architecture policy.
  arch/no-new-dependency-cycle:
    directive: G13
    status: ecosystem-covered
    replacement: import/no-cycle
    coverage: Covered by Oxlint's native import/no-cycle rule.
    reason: Custom cycle traversal was retired; Oxlint's maintained import graph is the correct owner.
    nextAction: Keep the locked retired custom no-cycle decision in place.
  arch/no-feature-scatter:
    status: spec-only
    coverage: Not enforced locally.
    reason: Feature scatter is a change-set and architecture-intent signal, not a reliable single-file AST rule.
    nextAction: Treat as review guidance until a repository analytics gate is explicitly scoped.
  boundary/no-raw-fetch-in-component:
    status: active-custom
    antidriftRule: antidrift/no-raw-fetch-in-component
    coverage: Implemented as a direct-fetch rule for JSX-returning lexical component frames.
    reason: A generated selector could ban fetch broadly, but the custom rule narrows to component-boundary context.
    nextAction: Re-inventory the narrowed JSX-returning lexical proof before restoring stable status; only widen to raw transport if real non-fetch evidence appears.
  boundary/no-sdk-direct-use-outside-gateway:
    status: generated-config
    replacement: no-restricted-imports from policy/registries/gateways.yaml
    coverage: Covered by generated Oxlint core restrictions with wrapper-file overrides.
    reason: Registry-backed import restriction is simpler and more idiomatic than a custom SDK rule.
    nextAction: Keep gateway imports in the gateways registry.
  boundary/no-env-access-in-client:
    status: research
    coverage: Not implemented.
    reason: The signal is likely deterministic, but client/server file boundaries and public env conventions need repo-specific evidence.
    nextAction: Evaluate maintained config options and real client env reads before writing a custom rule.
  domain/no-inline-domain-status:
    status: active-custom
    antidriftRule: antidrift/no-status-literal-in-type
    coverage: Implemented through registry-backed status literal detection in type contexts.
    reason: Domain statuses are repo facts, so the rule needs the domain registry rather than hardcoded strings.
    nextAction: Seek independent status-fork replication before stable promotion.
  domain/no-canonical-model-fork:
    status: active-custom
    antidriftRule: antidrift/no-canonical-model-fork
    coverage: Implemented as TypeChecker plus domain canonicalEntities registry comparison.
    reason: First-party canonical model forks need repo-owned type facts, not installed-package scanning.
    nextAction: Run adversarial review and boundary DTO/view-model clean-pressure classification before stable promotion.
  gen/require-import-from-generated:
    status: generated-config
    replacement: no-restricted-imports from policy/registries/generated.yaml
    coverage: Covered when generatedSources declare bannedDirectImports and wrappers.
    reason: Import routing is a registry-to-Oxlint-core concern, not a custom AST rule.
    nextAction: Keep generated.yaml current when codegen is added.
  gen/no-structural-type-fork:
    status: active-custom
    antidriftRule: antidrift/no-structural-type-fork
    coverage: Implemented as TypeChecker structural comparison against configured generated-source exports, with unaccepted installed-package matches emitted as semantic inventory/proposal facts when a fact sink is configured.
    reason: No maintained rule compares handwritten object shapes against package/generated exported types.
    nextAction: Seek independent generated-source fork replication and package-owner authority proposals before installed-package enforcement.
  auth/no-boundaryless-route:
    status: research
    coverage: Not implemented as a separate rule.
    reason: Boundaryless routes require framework-specific route/action discovery and should not be inferred from generic function shape.
    nextAction: Decide route framework scope after require-authz-check middleware and tRPC decisions.
  auth/no-client-only-authorization:
    status: research
    coverage: Not implemented.
    reason: Client-only authorization needs paired client/server reasoning and a concrete server policy convention.
    nextAction: Keep out of custom scope until real code shows the gap and expected server-side replacement.
  auth/require-authz-check:
    status: active-custom
    antidriftRule: antidrift/require-authz-check
    coverage: Enabled by default in createGovernanceOxlintConfig with authzFunctions derived from policy/registries/boundaries.yaml requiredCalls.authorization (inert when unconfigured).
    reason: Project authz calls are registry facts; handlers reading request params must invoke a configured boundary authorization function.
    nextAction: Keep enabled by default; extend to typed policy-wrapper route registration when framework route wrappers are declared.
  errors/preserve-caught-error:
    status: ecosystem-covered
    replacement: preserve-caught-error
    coverage: Covered by Oxlint's native preserve-caught-error rule.
    reason: Preserving caught error cause is ecosystem-covered; custom silent-catch work was retired.
    nextAction: Keep the maintained rule enabled.
  errors/no-fallback-to-empty:
    status: active-custom
    directive: G7
    antidriftRule: antidrift/no-fallback-to-empty
    coverage: Default error for a catch clause or promise .catch handler that drops the error and returns an empty array or object.
    reason: The real-program matrix across a second local corpus found 77 silent empty fallbacks in 12 repositories once catches that read or rethrow their error were excluded.
    nextAction: Keep enabled by default; extend to helper-delegated catches only with dataflow proof.
  naming/no-vague-names:
    status: active-custom
    directive: G21
    antidriftRule: antidrift/no-vague-names
    coverage: Off by default in the ESLint pass since October 2026; a project that holds G21 as policy enables antidrift/no-vague-names explicitly.
    reason: Vague nouns, abbreviations, single letters and filler affixes hide what a binding holds.
    nextAction: Align categories with the G21 rule in a private configuration repository; re-enable by default only with precision measured on repositories outside the G21 policy.
  arch/no-pass-through-parameters:
    status: active-custom
    directive: G22
    antidriftRule: antidrift/no-pass-through-parameters
    coverage: Default error in the ESLint pass for parameters a named function or component only forwards to another first-party layer.
    reason: Pass-through variables are Ousterhout's red flag for a layer that carries data it never uses.
    nextAction: Prune suppressions as layers stop threading values they do not read.
  compat/no-compat-names:
    status: active-custom
    directive: G5
    antidriftRule: antidrift/no-compat-names
    coverage: Default error in the ESLint pass for declared names containing legacy, compat, deprecated, retire or no longer.
    reason: No backwards compatibility and no codified removals; the name marks the path to delete.
    nextAction: Prune suppressions as compatibility paths are deleted; antidrift's retiredRules ledger is open G16 debt.
  simplicity/no-nested-ternary:
    status: ecosystem-covered
    directive: G8
    replacement: no-nested-ternary
    coverage: Native no-nested-ternary is generic enforcement owned by @joedeleeuw/typescript-tooling (its eslint adoption preset); this repository enables it in the root oxlint.config.mts.
    reason: The maintained rule matches the directive exactly, and Antidrift 0.15 leaves generic native rules to typescript-tooling.
    nextAction: Make no-nested-ternary a typescript-tooling default so consumers get G8 without opting into an adoption preset.
  simplicity/no-else-if-chain:
    status: active-custom
    directive: G9
    antidriftRule: antidrift/no-else-if-chain
    coverage: Default error for if/else-if chains of four or more branches whose equality tests share one discriminant.
    reason: A long chain over one value is an undeclared case space.
    nextAction: Keep enabled by default.
  provenance/no-hash-literal:
    status: active-custom
    directive: S1
    antidriftRule: antidrift/no-hash-literal
    coverage: Default error for 64-hex literals bound to hash, sha, digest, checksum or integrity names.
    reason: Hash pins of repo content go stale silently and duplicate what version control already proves.
    nextAction: Keep enabled by default.
  provenance/no-host-path-literal:
    status: active-custom
    directive: S4
    antidriftRule: antidrift/no-host-path-literal
    coverage: Default error for /home/<user>/ and /Users/<user>/ string literals outside test files.
    reason: Host-absolute paths tie code to one machine.
    nextAction: Keep enabled by default.
  provenance/no-dated-comments:
    status: active-custom
    directive: S5
    antidriftRule: antidrift/no-dated-comments
    coverage: Default error for standalone comments containing a 20xx date outside @example blocks and timestamps.
    reason: Dated provenance prose belongs in commit bodies and field notes.
    nextAction: Keep enabled by default.
  test/no-only-or-skip:
    status: ecosystem-covered
    replacement: vitest/no-focused-tests plus vitest/no-disabled-tests
    coverage: Covered by Oxlint's native Vitest rules for the declared test-file scope.
    reason: Oxlint's maintained Vitest plugin owns this surface.
    nextAction: Keep the native Vitest rules enabled; add Jest parity only if a repo adopts Jest.
  test/no-conditional-expect:
    status: ecosystem-covered
    replacement: vitest/no-conditional-expect
    coverage: Covered for the declared Vitest scope.
    reason: Oxlint's native Vitest plugin reports conditional assertions without banning ordinary test control flow.
    nextAction: Keep the native Vitest rule enabled.
  test/no-test-without-assertion:
    status: ecosystem-covered
    replacement: vitest/expect-expect
    coverage: Covered for the declared Vitest scope by Oxlint's native rule.
    reason: The maintained native rule is preferable to custom assertion counting.
    nextAction: Keep vitest/expect-expect enabled.
  ui/no-raw-tailwind-color:
    status: retired
    replacement: none
    coverage: Retired as a blocking design-system rule; no shipped Antidrift rule owns this id.
    reason: The implementation was a tiny regex palette sampler, not proof of project semantic token ownership.
    nextAction: Reintroduce only with an explicit design-token authority source and real clean/drift corpus evidence.
  ui/no-hover-translate-card:
    status: retired
    replacement: none
    coverage: Retired as a blocking design-system rule; no shipped Antidrift rule owns this id.
    reason: The implementation sampled hover translate class strings without proving card or pointer-target context.
    nextAction: Reintroduce only with real interaction-target proof and clean controls for non-card transforms.
  ui/no-generic-ai-copy:
    status: spec-only
    coverage: Not enforced locally.
    reason: Generic copy detection is heuristic by nature and currently lower value than type, validation, and boundary drift.
    nextAction: Keep as design review guidance unless a deterministic phrase registry with low-noise corpus evidence is scoped.
  obs/async-boundary-requires-context:
    status: spec-only
    coverage: Not enforced locally.
    reason: The repo lacks a concrete logging/tracing context API that a rule could require deterministically.
    nextAction: Define the positive observability construction pattern before any rule work.
  obs/no-fire-and-forget-without-tracking:
    status: research
    coverage: Not implemented.
    reason: Floating async work is valuable, but boundary tracking depends on approved background-task APIs and overlap with no-floating-promises.
    nextAction: Evaluate maintained promise rules and local tracking conventions before custom scope.
  perf/no-await-in-loop-with-io:
    status: ecosystem-covered
    replacement: Oxlint no-await-in-loop
    coverage: Covered by Oxlint's broad native no-await-in-loop baseline.
    reason: IO-specific narrowing is not implemented; the active guard is the maintained broad rule.
    nextAction: Only add IO-function narrowing if broad-rule findings prove too noisy in real code.
  perf/no-async-array-method:
    status: ecosystem-covered
    replacement: typescript/no-misused-promises
    coverage: "@joedeleeuw/typescript-tooling reports async filter, some, every and find callbacks through typescript-eslint's no-misused-promises and async forEach callbacks through its ESLint restricted syntax. antidrift/no-async-array-method is retired."
    reason: Antidrift does not re-implement ecosystem rules (owner decision, October 2026). Turning on no-misused-promises argument checks instead adds 165 reports across opencode, LibreChat and cloudflare/agents, none of them async forEach, so typescript-tooling keeps that setting off and names forEach explicitly.
    nextAction: Keep the forEach restricted-syntax entry in typescript-tooling; arrays of promises from async map remain typescript-eslint no-floating-promises territory.
  perf/no-unbounded-promise-all:
    status: research
    coverage: Not implemented.
    reason: Useful if tied to obvious unbounded collections, but Promise.all over small or prebounded arrays is common and clean.
    nextAction: Build real drift and clean bounded-control programs before coding.
  perf/require-timeout-for-network-call:
    status: research
    coverage: Not implemented.
    reason: The construction pattern should likely be gateway-scoped timeout or AbortSignal propagation, not any fetch-like call.
    nextAction: Define gateway/network call inventory and maintained-rule overlap before implementation.
  perf/no-redundant-validation:
    status: active-custom
    antidriftRule: antidrift/no-redundant-zod-parse
    coverage: Implemented as schema-provenance detection for reparsing values already produced by the same Zod schema.
    reason: No maintained Zod rule tracks same-schema output provenance.
    nextAction: Stable for current scope; keep same-schema-recertification research separate.
  sec/no-hardcoded-secret:
    status: spec-only
    coverage: Not wired in this repository.
    reason: Secret detection should be delegated to a maintained scanner; custom AST variable-name heuristics are not acceptable.
    nextAction: Wire a maintained secret scanner before claiming enforcement.
  sec/no-sql-string-concat:
    status: active-custom
    antidriftRule: antidrift/no-sql-string-concat
    coverage: Enabled by default in createConfig with AST, scope-binding guard, escaper, and TypeChecker declaration-source/member provenance.
    reason: Ecosystem SQL plugins such as eslint-plugin-sql-template and ai-guard-dev/eslint-plugin-ai-guard lack TypeChecker escaper/member provenance, HogQL/template sentence coverage, and static/placeholder fragment flow proof.
    nextAction: Keep antidrift/no-sql-string-concat enabled at error; expand configured safeTemplateTags and safeIdentifierMembers only with TypeChecker declaration-source proof.
  sec/no-unsafe-deserialize:
    status: ecosystem-covered
    replacement: typescript/no-unsafe-argument
    coverage: "@joedeleeuw/typescript-tooling reports JSON.parse of any input with typescript-eslint's no-unsafe-argument and parsed values flowing into typed code with no-unsafe-assignment and no-unsafe-return; the compiler rejects JSON.parse of unknown. antidrift/no-unsafe-deserialize is retired."
    reason: Antidrift does not re-implement ecosystem rules (owner decision, October 2026); every test case of the retired rule is reported by those rules.
    nextAction: None in antidrift; typescript-tooling owns the any-safety rules.
  agent/block-generated-policy-edits:
    status: hook-covered
    replacement: block-generated-policy-edits hook
    coverage: Covered by generated Claude/Codex PreToolUse hooks.
    reason: Tool lifecycle checks belong in hooks because they block edits before source semantics exist.
    nextAction: Keep generated hook artifacts in sync from policy/agent-guardrails.yaml.
  agent/lint-after-edit:
    status: hook-covered
    replacement: pnpm policy:check:changed PostToolUse hook
    coverage: Covered by generated Claude/Codex PostToolUse hooks.
    reason: Changed-file validation is an edit-loop control-plane check.
    nextAction: Keep check-changed and generated hook artifacts aligned.
  agent/require-checks-before-push:
    status: policy-script
    replacement: pnpm policy:verify-session pre-push hook
    coverage: Covered by the repository's simple-git-hooks pre-push hook; the publish workflow runs pnpm verify:release.
    reason: The release gate runs typecheck, both lint tiers, tests and the packed consumer, so it belongs at the push boundary, not at the end of every agent turn.
    nextAction: Keep verify-session on pre-push; edit-loop feedback stays with agent/lint-after-edit.
  policy/no-check-weakening-without-policy-task:
    status: policy-script
    replacement: pnpm policy:check:changed
    coverage: Covered for protected generated/config paths through the changed-file policy check.
    reason: Toolchain weakening is a repository control-plane concern rather than an AST rule.
    nextAction: Extend protected-file coverage only when new control-plane files are added.
  policy/no-inline-disable-without-ticket:
    status: ecosystem-covered
    replacement: "eslint-comments/require-description plus typescript/ban-ts-comment"
    coverage: Covered by an Oxlint-hosted directive-description rule and Oxlint's TypeScript suppression rule.
    reason: Ticket-string matching was retired; descriptions are the maintainable ecosystem path.
    nextAction: Keep the locked retired custom decision in place.
  mcp/no-unapproved-server:
    status: spec-only
    coverage: Not enforced locally.
    reason: MCP allowlist enforcement belongs in policy scripts/config checks, but no implementation is scoped yet.
    nextAction: Implement only if MCP registry changes become part of the active package surface.
  mcp/pin-server-version:
    status: spec-only
    coverage: Not enforced locally.
    reason: Version pinning is registry/config validation, not ESLint, and no active MCP consumer path is scoped.
    nextAction: Keep in mcp.yaml as policy guidance until MCP enforcement work is explicit.
  sonar/import-custom-eslint-issues:
    status: policy-script
    replacement: pnpm sonar:prepare
    coverage: Covered by Sonar's native ESLint report import; pnpm sonar:prepare writes reports/eslint-antidrift.json and sonar-project.properties points sonar.eslint.reportPaths at it.
    reason: Sonar issue import is report generation and scanner configuration, not a lint rule.
    nextAction: Keep the ESLint JSON report path documented in sonar guidance.
  sonar/ai-code-governance-preset:
    status: delegated
    replacement: sonar/antidrift-ai-code-governance.yaml
    coverage: Delegated to SonarQube quality profiles, native Sonar rule keys, and quality gate metrics.
    reason: Broad AI-assisted quality and reward-hacking symptoms such as complexity, duplication, weak coverage, generic test weakness, security hotspots, accessibility gaps, and portfolio maintainability are Sonar governance concerns rather than custom Antidrift ESLint rules.
    nextAction: Keep the preset declarative with native Sonar keys and review Sonar way / Sonar agentic AI diffs before changing the base profile.
  sonar/no-new-critical-issues:
    status: delegated
    replacement: SonarQube quality gate
    coverage: Delegated to server-side Sonar quality gate configuration.
    reason: Critical issue gating is owned by Sonar once external issues and scanner properties are present.
    nextAction: Configure the Sonar server gate for consuming projects.
  sonar/complexity-budget:
    status: delegated
    replacement: SonarQube cognitive complexity and duplication metrics plus the @joedeleeuw/typescript-tooling Oxlint complexity rules
    coverage: Sonar owns cognitive complexity, duplication, and trend/gate metrics; @joedeleeuw/typescript-tooling's Oxlint config provides the local cyclomatic-complexity, nesting-depth, and parameter-count gate.
    reason: Complexity budgeting splits between fast local source pressure and portfolio/PR governance; neither needs custom Antidrift ESLint rule work.
    nextAction: Keep Sonar guidance current and keep the optional local metric gate limited to complexity, depth, and parameter count.
  rules/one-source-generates-agent-files:
    status: policy-script
    replacement: pnpm policy:check-generated
    coverage: Covered by generated artifact verification against policy/agent-guardrails.yaml.
    reason: Instruction consistency is a source-of-truth generation check.
    nextAction: Keep generated targets synchronized through policy:generate.
  rules/no-vague-agent-rules:
    status: spec-only
    coverage: Not enforced locally.
    reason: Vague-rule detection is heuristic and currently lower priority than deterministic source and registry checks.
    nextAction: Do not implement without a phrase taxonomy, examples, and real false-positive review.

rules:
  antidrift/no-handrolled-resource-lifecycle-cells:
    status: ready
    stable: false
    defaultOff: false
    signal: source binding plus local transition/control-flow proof
    solveType: react-state-shape
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-roadmap.md
    corpusRepositories:
      [private-app, sudocode-main, cloudflare-agents, private-app-2]
    concerns:
      - "After the lifecycle proof rewrite, local fixed-proof scans checked 3,323 files across three private apps, Sudocode, Opencode UI/console, Cloudflare Agents, and PowerSync; they classified 230 broad co-mutation inventory facts and emitted 9 resourceLifecycleProof diagnostics across one of the private apps, Sudocode, and Cloudflare Agents."
      - "Pinned drift anchors include reporting screens in a private app, Sudocode execution handlers, and Cloudflare examples; pinned clean controls include auth-form submit state in another private app plus synchronous/view-state controls from the first private app."
      - Broad co-mutation and sourceMemberStateShardCandidate fan-out are inventory only; blocking requires a transition that toggles a boolean lifecycle cell, writes a distinct error cell inside catch, and assigns a distinct payload cell from an awaited value or first-level awaited source member.
      - Absorbs antidrift/no-shattered-ingested-entity-state so all per-component React state cell and transition semantic facts (resourceLifecycleProof, stateSetterCoMutation, sourceMemberStateShardCandidate) are emitted by one rule pass.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported React rule was found that models multiple local state setters as one state-machine smell."
      whyNotOtherState: "Not partial-overlap because generic hooks rules do not reason about coupled setter bindings in one handler."
    examples:
      flags:
        - "onClick={() => { setData(data); setLoading(false); setError(null); }}"
      allows:
        - "setDataOne(left); setDataTwo(right);"
        - 'dispatch({ type: "loaded", data });'
    nextAction: Enabled at error for deterministic resourceLifecycleProof diagnostics; broad co-mutation and sourceMemberStateShardCandidate remain inventory-only.
  antidrift/no-defensive-shape-probing:
    status: ready
    stable: false
    signal: TypeChecker plus AST shape
    solveType: broad-value-shape-probing
    proofBuckets: [semantic-source-type-provenance]
    referenceDoc: docs/rule-investigations/no-defensive-shape-probing.md
    corpusRepositories: [private-app, sudocode-main, private-app-3, opencode]
    concerns:
      - Object.entries extractor branch has real drift evidence from a private app.
      - Boolean predicate helper branch was removed and remains separate research.
      - The rule now requires the entries value binding to be any/unknown before shape-probe counting matters.
      - Benchmarking shows the current any-typed drift in a private app is also reported by @typescript-eslint unsafe member-access rules on the individual property reads, while antidrift reports one callback-level architectural finding.
      - "pnpm policy:inventory-defensive-shape now makes the sunset sweep reproducible: 1,680 type-aware files, 72 Object.entries transform syntax candidates, 1 custom finding, 0 parser errors, and 1 drift repository."
      - Stable promotion remains blocked; the reproducible sweep found no second drift repository and the one private-app finding has same-file upstream unsafe-rule overlap.
      - Claude Opus 4.8 advisory review recommends demoting to inventory/off or retiring if no second drift appears beyond upstream unsafe-member coverage.
      - "Wide corpus sweep (54 TypeScript repositories, 26,379 type-checked files, 725 Object.entries iteration callbacks in 36 repositories): 0 findings, 0 false positives. Enabled at error with the bulk-suppression baseline; the rule has no second drift repository yet."
    external:
      state: partial-overlap
      support: medium
      candidates:
        - "@typescript-eslint/no-unsafe-member-access"
        - "@typescript-eslint/no-unsafe-return"
        - "@typescript-eslint/no-unsafe-assignment"
      decision: own-antidrift
      whyThisState: "TypeScript ESLint unsafe rules catch many any-leak symptoms, including the current private-app member-access reads, but they do not group Object.entries mini-parsers or point to owned schema/converter construction."
      whyNotOtherState: "Not ecosystem-covered because the custom rule's value is the callback-level normalization smell and replacement path; not net-antidrift because the current any-typed drift has upstream unsafe-rule overlap."
    examples:
      flags:
        - 'Object.entries(raw as Record<string, unknown>).map(([, value]) => "numberValue" in value ? value.numberValue : null)'
      allows:
        - "const parsed = schema.parse(raw);"
        - "Object.entries(typedMap).map(([id, value]) => value.name)"
    nextAction: Blocking at error in the ESLint pass. Retire if no second real drift repository appears beyond upstream unsafe-member coverage; do not promote to stable until one does.
  antidrift/no-inline-structural-type-at-use-site:
    status: ready
    stable: false
    defaultOff: false
    directive: W4
    signal: TypeScript identity, from semantic-adapters/shape-identity.mjs, between a boundary-parameter inline object type with at least three members and an existing first-party object type.
    solveType: type-contract-shape
    proofBuckets: [local-ast-source-shape]
    promotion:
      proofBucket: local-ast-source-shape
      association: Boundary parameter types match first-party declarations in the TypeScript program.
      blockingThreshold: A named object type or a same-package inline shape is identical at every depth under four comparison rules (an error type on either side makes the comparison undecided and reports the site as incomplete analysis; any on either side never matches; the same type, or the same generic reference or alias with equal type arguments, matches without comparing what it contains; everything else is compared structurally, type-parameter constraints and defaults included), the owner does not derive from the reported declaration, and the owner's file does not declare itself generated.
      ecosystemComparison: Syntax selectors cannot compare property types across declarations.
      corpusEvidence: "October 14, 2026 fresh hit-weighted sample after the course review, capped at 3 per repository and excluding every earlier-labelled location: 29 of 30 true across 15 repositories of oss-corpus and oss-corpus-agents, 14 at 70% or more. The round-4 sample before it scored 24 of 24; the round-3 review's independent labels scored 23 of 24."
      realCorpusInventory: "899 restatement hits in 21 oss-corpus repositories (4,401 before the shape work), 7 of them in fixtures directories now that the preset no longer ignores **/fixtures/**, and 19 in 8 agent-written repositories; 179 undecided comparisons in oss-corpus."
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-inline-structural-type-at-use-site.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: "1 of 30 in the fresh sample: a test helper's expected error shape (name, message, cause) coinciding with the intersection part of a named error type."
      knownFalseNegatives: "Return annotations, variables, properties and component props stay outside the boundary-parameter scope. Separately written shapes that compare any directly, such as two { payload: any } fields, do not match."
      productionConcerns: Generated owners without a generator declaration still count as first-party. A suggested owner can be another module's copy of the same concept, such as a browser protocol type.
      noSinkBehavior: Diagnostics do not require a separate output file.
      noDeadWorkBehavior: Unique inline shapes, named parameter types and owners in files that declare themselves generated stay clean.
    referenceDoc: docs/rule-investigations/no-inline-structural-type-at-use-site.md
    corpusRepositories: [oss-corpus, oss-corpus-agents]
    concerns:
      - TypeScript services are required. Missing services produce an error.
      - Dependencies, TypeScript library files, compiler-mapped declaration copies and files whose leading comment declares them generated (a line that opens with an @generated tag, a Code generated ... DO NOT EDIT line, or a line opening with "this file was generated by", "this is generated from" or "generated by") do not supply owners.
      - An owner whose declaration, directly or through type aliases, interfaces and the declared types or initializers of variables it references (function bodies and whole modules excluded), resolves through the checker to a declaration containing the reported type, such as Parameters<typeof f>[0], is never suggested.
      - "Comparison rules: an error type on either side makes the comparison undecided, reported as incomplete analysis at the site when no owner matches; any on either side never matches; the same type, or the same generic reference or alias with equal type arguments, matches without comparing what it contains, so any inside a shared named type is not a wildcard; everything else is compared structurally under the same rules, type-parameter constraints and defaults included."
      - Repeated unnamed shapes must belong to the same package.
    external:
      state: partial-overlap
      support: medium
      candidates: ["ESLint no-restricted-syntax"]
      decision: own-antidrift
      whyThisState: "Core selectors can find inline type literals, but only the TypeChecker can prove that one repeats an existing shape."
      whyNotOtherState: "Not equivalent because a raw syntax ban would report every unique inline shape."
    examples:
      flags:
        - "type LoadInput = { userId: string; tenantId: string; limit: number }; export function load(input: { userId: string; tenantId: string; limit: number }) {}"
      allows:
        - "export function load(input: LoadInput) {}"
        - "export function load(input: { uniqueOption: string; other: number; third: boolean }) {}"
    nextAction: Blocking at error. Review generated owners without a declaration and owners that are another module's copy of a concept before stable promotion.
  antidrift/no-restated-dependency-type:
    status: ready
    stable: false
    defaultOff: false
    directive: W4
    signal: TypeScript identity, from semantic-adapters/shape-identity.mjs, between a first-party interface or type literal with at least three members and an interface or type alias exported from the public entry points of a declared dependency, including workspace packages.
    solveType: type-contract-shape
    proofBuckets: [local-ast-source-shape]
    promotion:
      proofBucket: local-ast-source-shape
      association: First-party object types matched against interfaces and type aliases exported, directly or through exported namespaces, from the root and subpath exports of packages named in the nearest package.json dependencies and peerDependencies, and of devDependencies that the package's files import, directly or through their @types/ package.
      blockingThreshold: The types are identical at every depth under the four comparison rules of semantic-adapters/shape-identity.mjs, an error type making the comparison undecided and reported as such; classes and exports declared only in the linted package are not owners; an interface that merges into the owner export itself does not report.
      ecosystemComparison: No maintained lint rule compares first-party types with installed package exports.
      corpusEvidence: "October 14, 2026 fresh sample after the course review: 69 decided reports no earlier label, sample or review named remain in 5 repositories, and the 3-per-repository cap selects 11; 9 true with a vendored declaration copy and a coincidental three-id test type counted false (81.8%), 3 repositories at 70% or more. The round-4 sample before it scored 19 of 24; agreement with the dependency corpus detector: 62 of 65 positives, 0 of 47 negatives."
      realCorpusInventory: "235 restatement reports in 21 oss-corpus repositories, 1 in a fixtures directory now that the preset no longer ignores **/fixtures/**, and 88 in 18 agent-written repositories; 17 undecided comparisons in oss-corpus."
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-restated-dependency-type.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 5
      knownFalseNegatives: Class exports, separately written shapes that compare any directly, development dependencies the package's files do not import, and exports of declared dependencies that neither node_modules nor the compiler options resolve are not compared; antidrift/no-unresolved-dependency-types reports those dependencies.
      productionConcerns: Vendored declaration copies, data-migration snapshots and small shapes that coincide with an unrelated library still report.
      noSinkBehavior: Diagnostics do not require a separate output file.
      noDeadWorkBehavior: Types that differ in any field, flag or nested type, interfaces that merge into the owner export and class owners stay clean.
    referenceDoc: docs/rule-investigations/no-restated-dependency-type.md
    corpusRepositories: [oss-corpus, oss-corpus-agents]
    concerns:
      - TypeScript services are required. Missing services produce an error.
      - The inventory covers the linted file's own package. Its dependencies' entry points missing from the linted program are added to a second program rooted at that package's files, the program's root declaration files and the missing entries, and each program keeps only the last package's inventory. Before, a program spanning a whole workspace inventoried every package's dependencies at once; linting two opencode plugin-browser files through the root project resolved 42,068 entries, added 5,019 entry files to the second program and peaked at 7,232 MB; scoped to the package it resolves 596 entries, adds 128 and peaks at 3,656 MB with the same reports.
      - "Development dependencies are inventoried only when the package's files import them, directly or through their @types/ package; runtime and peer dependencies always are. On antidrift itself, inventorying every development tool took ESLint's peak heap to 3,446 MB for this rule alone and 3,629 MB for all rules, and pnpm lint:custom-typed ran out of the default 2,198 MB Node heap. With the filter the rule alone peaks at 1,089 MB and all rules at 1,170 MB, and the 15 restatement reports on the cloudflare/agents, LibreChat and opencode scan groups are unchanged."
      - Dependencies and entries this rule cannot inventory are reported by antidrift/no-unresolved-dependency-types, which runs whether or not this rule is enabled.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "Maintained rules do not inspect dependency exports when checking first-party type declarations."
      whyNotOtherState: "Not partial overlap because no-structural-type-fork reports installed packages only for owners accepted in ownership.yaml."
    examples:
      flags:
        - "interface ApiError { code: string | null; message: string; param: string | null; type: string } // restates openai ErrorObject"
      allows:
        - "import type { ErrorObject } from 'openai/resources';"
        - "declare module 'vitest' { interface ProvidedContext { db: Database; client: Client; server: Server } }"
    nextAction: Blocking at error. Find evidence that separates vendored declaration copies and migration snapshots before stable promotion.
  antidrift/no-unresolved-dependency-types:
    status: ready
    stable: false
    defaultOff: false
    directive: W4
    signal: Package manifests linted with @eslint/json and TypeScript module resolution of declared dependencies and their public entries.
    solveType: type-contract-shape
    proofBuckets: [local-ast-source-shape]
    promotion:
      proofBucket: local-ast-source-shape
      association: Keys of dependencies, devDependencies and peerDependencies in package.json, matched to node_modules and to module resolution under the governing tsconfig.
      blockingThreshold: "A declared dependency that neither node_modules nor module resolution finds, reported on its key; a workspace or linked dependency (real path outside node_modules) with a public script entry, wildcard-expanded JavaScript targets included, that does not resolve to type declarations, or a wildcard entry that matches no file at all, reported once per package on the key of the first dependency field naming it (a wildcard whose existing targets are all blocked by null patterns is decided). Installed registry artifacts with a dangling types target publish no owners there and are not reported on their key."
      ecosystemComparison: TypeScript reports a missing, untyped or unresolved import where it is written (TS2307, TS7016, TS2882), so import sites are left to the compiler. Neither TypeScript nor eslint-plugin-import reports declared-but-uninstalled dependencies on manifest keys or unbuilt workspace entries that no file imports.
      corpusEvidence: "October 14, 2026 fresh hit-weighted sample, capped at 3 per repository: 22 of 24 real gaps across 12 repositories, 10 at 70% or more. The two false reports, entries blocked by null export patterns and a side-effect import of an existing JavaScript-only marker, were fixed after the freeze; both no longer report and the 22 true reports remain."
      realCorpusInventory: "oss-corpus rescan after the course review, fixtures directories included now that the preset no longer ignores them: 4,652 missing-package manifest keys and 4,401 unresolved workspace-entry manifest keys; agent-written: 8 and 6. The same scan held 6,304 missing-package import sites and 53,141 unresolved imports of installed packages, which are left to the compiler."
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-unresolved-dependency-types.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: An installed registry artifact with a dangling types entry that no file imports is not reported, by owner ruling.
      productionConcerns: A checkout whose workspace packages are not built reports each declaring manifest key until they are built.
      noSinkBehavior: Diagnostics do not require a separate output file.
      noDeadWorkBehavior: Installed dependencies with resolving declarations, asset-only entries such as ./styles.css and null-blocked export patterns stay clean.
    referenceDoc: docs/rule-investigations/no-unresolved-dependency-types.md
    corpusRepositories: [oss-corpus, oss-corpus-agents]
    concerns:
      - "Import sites are left to the TypeScript compiler. On TypeScript 6.0.3 with strict, a probe project gets TS2307 for an import of a declared but uninstalled package, TS7016 for an installed package without declarations (static, dynamic and import-type forms) and TS2882 for a side-effect import of an unbuilt subpath."
      - The preset enables the rule in a **/package.json block that uses ESLint's JSON language from @eslint/json 0.14.0, so every createConfig() consumer gets the reports without further setup.
    external:
      state: partial-overlap
      support: medium
      candidates:
        [
          "TypeScript TS2307",
          "TypeScript TS7016",
          "eslint-plugin-import no-unresolved",
        ]
      decision: own-antidrift
      whyThisState: "The compiler reports unresolved and untyped imports where they are written, and this rule leaves those to it. Neither the compiler nor import plugins report uninstalled dependencies or unbuilt workspace entries on the declaring manifest."
      whyNotOtherState: "Not equivalent because a dependency that no file imports is invisible to import-site checks."
    examples:
      flags:
        - '"dependencies": { "never-installed": "1.0.0" } // not in node_modules'
      allows:
        - '"dependencies": { "zod": "^4.0.0" } // installed with type declarations'
    nextAction: Blocking at error. Seek a published-artifact owner ruling for dangling types entries before stable promotion.
  antidrift/no-near-duplicate-type:
    status: ready
    stable: false
    defaultOff: false
    directive: W4
    signal: TypeScript checker member names and member types of interfaces, object-literal type aliases and inline parameter object types in one package, matched between declarations in the same module or in modules that import one another, with imports resolved by the checker (semantic-adapters/shape/near-duplicate-types.ts, semantic-adapters/shape/object-type-index.ts, semantic-adapters/provenance/module-imports.ts).
    solveType: type-contract-shape
    proofBuckets: [semantic-source-type-provenance]
    promotion:
      proofBucket: semantic-source-type-provenance
      association: A local object type to the object type of its package that its module already imports, resolved through re-export barrels, or to a named, signature, exported or earlier declaration of its own module.
      blockingThreshold: At least three shared member names covering 80% of the smaller type with a Jaccard index of at least 0.45; every shared member of the same checker type under the semantic-adapters/shape/shape-identity.ts rules, where optional x?:T equals required x:T|undefined and an error type or any reached through a reference makes the comparison undecided; the two are not related by extends, nesting or declaration merging; the owner is the side whose module the other's module imports, or in one module the named, signature, exported, then earlier declaration; parameter types that antidrift/no-inline-structural-type-at-use-site reports are left to it.
      ecosystemComparison: Token-based copy detection (SonarQube CPD, jscpd) needs long identical token runs in order and never compares member types, so reordered, subset, superset and optionality-changed copies of a type pass it.
      corpusEvidence: "Seeded 300-file samples (seed 20261022) of opencode, LibreChat, cloudflare/agents and agent-native, excluding every file named by the prototype labels and capped at 10 per repository: 25 of 27 fresh findings real after reading the code (opencode 4/4, LibreChat 8/8, agents 4/5, agent-native 9/10; 23/27 with the two borderline shared-base calls counted false). The prototype gate that set the thresholds scored 31/32 out of sample and 14/14 in sample."
      realCorpusInventory: "52 decided and 10 undecided reports in 1,094 linted files of the four 300-file samples (opencode 5 in 300, LibreChat 9 and 4 in 281, agents 18 and 3 in 287, agent-native 20 and 3 in 226); no site reported by both this rule and antidrift/no-inline-structural-type-at-use-site."
      realCorpusInventoryRefs:
        - docs/rule-investigations/no-near-duplicate-type.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: "2 of 27 in the fresh sample: a test's fake DevTools target record against the report entry built from such records, and a prototype screen transition against a diagram edge whose schemas differ."
      knownFalseNegatives: "Copies whose modules do not import each other (8 of 45 labelled prototype duplicates connect only through a third module or a third type), owners in other packages, members that mention different type parameters of two generic declarations, and types below three shared members."
      productionConcerns: Generic sibling vocabularies (a from/to/label edge, an id/name/query triple) can pass the gate when the two modules already import each other; the reported owner can be another copy of a third type that the rule does not index, such as a generated or dependency type.
      noSinkBehavior: Diagnostics do not require a separate output file.
      noDeadWorkBehavior: Types whose shared fields differ in type, types below the overlap gate, types in modules that do not import each other, types related by extends, and members written as never or undefined stay clean; member types resolve only for pairs that pass the name gate and the module connection, and subtrees without TypeScript syntax are not walked.
    semanticAdapterStatus:
      status: inline-pending
      reason: The package object-type index, member comparison and module-import provenance live in semantic-adapters/shape/object-type-index.ts, semantic-adapters/shape/near-duplicate-types.ts and semantic-adapters/provenance/module-imports.ts with this rule as their one consumer; no semantic adapter contract claims them yet.
    referenceDoc: docs/rule-investigations/no-near-duplicate-type.md
    corpusRepositories: [opencode, LibreChat, cloudflare-agents, agent-native]
    concerns:
      - TypeScript services are required. Missing services produce an error.
      - Members that resolve to the error type, or to any through a written reference, make the comparison undecided; repositories with unbuilt workspace packages (cloudflare/agents, LibreChat) get undecided reports until those packages are built.
      - Exact repeats in boundary parameter types belong to antidrift/no-inline-structural-type-at-use-site; this rule asks that rule before reporting a parameter type, which builds that rule's program index when it is disabled.
      - Overlap with antidrift/no-restated-dependency-type, no-structural-type-fork and no-canonical-model-fork was not measured; the sampled repositories configure no generated or domain owners, and no-restated-dependency-type exceeded the 4 GB heap on an opencode package where this rule peaked at 3.4 GB.
    external:
      state: net-antidrift
      support: none
      candidates: ["SonarQube copy-paste detection", "jscpd"]
      decision: own-antidrift
      whyThisState: "No maintained lint rule compares the member names and checker types of first-party object types or chooses the owner a copy should derive from."
      whyNotOtherState: "Not partial overlap because token-based copy detection reports textual blocks, never a type that repeats a subset, superset or reordering of another's fields."
    examples:
      flags:
        - "export interface Options { staleMs?: number; timeoutMs?: number; signal?: AbortSignal } type Opts = { staleMs: number; timeoutMs: number } // Required<Pick<Options, 'staleMs' | 'timeoutMs'>>"
        - "import { translate } from './geometry'; interface StateBoxBounds { id: string; left: number; top: number; width: number; height: number } // geometry.ts exports Bounds { left; top; width; height }"
      allows:
        - "interface StateBoxBounds extends Bounds { id: string }"
        - "type Row = { id: string; name: string; status: string }; type Ticket = { id: string; name: string; status: 'open' | 'closed' }"
        - "interface Panel { id: string; left: number; top: number; width: number; height: number } // module does not import geometry.ts"
    nextAction: Blocking at error. Measure overlap with no-restated-dependency-type on a host with heap for its second program, and decide whether a connection through a third module (value flow) should count, before stable promotion.

