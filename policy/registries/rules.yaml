      ecosystemComparison: Import restrictions and generic naming rules cannot detect structural copies of generated or installed package exported types; no maintained TypeScript ESLint rule compares local object declarations against configured owner exports.
      corpusEvidence: A private app provides clean pressure for generated imports, installed base-client aliases, local tuple aliases, projected DTO subsets, and utility-type derivations. After subset matching was removed, current real corpus does not yet provide a promoted exact blocking generated/package-owner fork. Another private app provides a Convex document field-usage clean control; a dogfood sweep over that app's client source and Convex functions found no exact-copy forks of the implicit owners.
