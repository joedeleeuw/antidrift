    corpusRepositories: [private-app, private-app-3, private-app-2]
    concerns:
      - "Absorbs antidrift/no-parse-as-cast so both local parse provenance and declared schema-output parameter contracts (z.infer/z.output/z.TypeOf, Schema.Schema.Type/typeof S.Type, v.InferOutput) are enforced by a single owner across Zod and Effect Schema decoders."
      - "Test assertion scope is decided: parses inside throw assertion callbacks and parameter contract parses inside test files are schema-contract checks, not validation-boundary drift."
      - 'Next.js server actions are exempt for declared parameter contracts: a function exported from a module with a top-level "use server" directive, or carrying the directive in its own body, is a network endpoint whose declared parameter type the client never satisfied.'
      - "Call-result type-equivalence branches were removed on 2026-08-10: bidirectional assignability between a helper's declared return type and the schema output never proves that schema validated the value, because refinements (.min, .positive, .refine, .transform) are invisible to TypeScript. The false-positive shape is NonEmpty.parse(readName()) with readName(): string. Same-binding decoder provenance and explicit schema-output parameter provenance remain blocking."
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: "No supported Zod rule was found that tracks schema provenance and reports re-parsing a value already produced by or declared from the same schema."
      whyNotOtherState: "Not partial-overlap because generic unsafe-assignment rules do not distinguish raw input from schema-owned output."
