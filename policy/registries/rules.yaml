      - Validator delegation is allowed, so stable promotion should classify schema-backed predicate inventories.
      - Discriminant guards over already-typed unions stay outside the report path.
      - "Nominal and discriminant evidence counts as proof: an instanceof whose instance type is assignable to the asserted type, a delegated type predicate (including Effect Schema.is and Predicate.isTagged) whose asserted type is assignable or whose fields cover the required ones, and a literal equality (member, element, Reflect.get, or a local bound to one) against a literal-typed property of the asserted type. Equality against a property typed string is not a discriminant."
