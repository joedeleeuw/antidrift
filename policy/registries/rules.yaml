    nextAction: Keep at error with the suppressions ratchet; delete compatibility paths instead of renaming them.

  antidrift/no-fallback-to-empty:
    status: ready
    stable: false
    defaultOff: false
    directive: G7
    signal: Deterministic AST plus scope references of the caught error
    solveType: no-fallback-to-empty
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories:
      [
        opencode,
        sudocode-main,
        executor,
        private-app-4,
        private-app-2,
        agent-browser,
      ]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 219 hits in 31 repositories, 16/20 true across 16 repositories. False positives: a poll retry inside a deadline loop, a {} fed to a schema that rejects it, and two error-body parse fallbacks on paths that still throw."
      - Only silent failure paths report; a catch that reads its error or rethrows keeps empty as an explicit contract.
      - The governance preset excludes `**/fixtures/**`, where failure behavior is modeled on purpose, matching the ESLint pass ignores.
    external:
      state: partial-overlap
      support: medium
      candidates:
        [
          eslint/no-empty,
          preserve-caught-error,
          unicorn/prefer-optional-catch-binding,
        ]
      decision: own-antidrift
      whyThisState: Ecosystem rules catch empty blocks and lost causes, not a failure path that returns an empty collection.
      whyNotOtherState: The empty-collection return is the construct the policy names.
    examples:
      flags:
        - "async function load() { try { return await read(); } catch { return []; } }"
        - "const body = await response.json().catch(() => ({}));"
      allows:
        - 'function readRegistry(path) { try { return parse(read(path)); } catch (error) { if (error.code === "ENOENT") return {}; throw error; } }'
    nextAction: Keep at error severity in the governance preset.

  antidrift/no-else-if-chain:
    status: ready
    stable: false
    defaultOff: false
    directive: G9
    signal: Deterministic AST over equality tests that share one discriminant
    solveType: no-else-if-chain
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories:
      [private-app-4, pierre, executor, opencode, sudocode-main, hunk, codiff]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 122 hits in 28 repositories, 19/20 true across 19 repositories; the false positive picks list positions in a demo screen."
      - Four or more branches matches the G9 elif-chain rule in a private configuration repository, whose threshold is an if plus three elifs.
    external:
      state: partial-overlap
      support: medium
      candidates: [unicorn/prefer-switch, sonar/max-switch-cases]
      decision: own-antidrift
      whyThisState: unicorn/prefer-switch is not hosted by the governance preset and suggests a switch rather than a declared case table.
      whyNotOtherState: The directive asks for the case space to be declared, which a table checked with satisfies satisfies.
    examples:
      flags:
        - 'if (mode === "a") run(1); else if (mode === "b") run(2); else if (mode === "c") run(3); else if (mode === "e") run(4);'
      allows:
        - 'if (mode === "a") run(1); else if (kind === "b") run(2); else if (mode === "c") run(3); else if (mode === "e") run(4);'
    nextAction: Keep at error severity in the governance preset.

  antidrift/no-hash-literal:
    status: ready
    stable: false
    defaultOff: false
    directive: S1
    signal: Deterministic AST for a 64-hex literal bound to a hash, sha, digest, checksum or integrity name
    solveType: no-hash-literal
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories: [private-app-2]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 19 hits in 5 repositories, 1/19 true. Release-download checksums beside their URL, fetched-source pins and test expectations dominated. Test files and digests in an object with a url or href are now skipped: 2 hits, both in one script in a private app and both inspected before (the patch digest true, the source digest an upstream tarball). Too few hits to measure; no fresh sample exists."
      - Unnamed 64-hex literals such as test keys and OAuth client IDs are not hash pins and stay out.
    external:
      state: net-antidrift
      support: none
      candidates: [sec/no-hardcoded-secret]
      decision: own-antidrift
      whyThisState: Secret scanners look for credentials, not content pins.
      whyNotOtherState: The binding name is what identifies a pin.
    examples:
      flags:
        - 'const patchSha256 = "abababababababababababababababababababababababababababababababab";'
      allows:
        - 'const encryptionKey = "abababababababababababababababababababababababababababababababab";'
    nextAction: Keep at error severity in the governance preset.

  antidrift/no-host-path-literal:
    status: ready
    stable: false
    defaultOff: false
    directive: S4
    signal: Deterministic AST for /home/<user>/ and /Users/<user>/ string prefixes outside test files
    solveType: no-host-path-literal
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories: [opencode, executor]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 30 hits in 6 repositories, 2/20 true; only opencode's two developer-home paths couple to a host. Story files, __mocks__ and e2e trees are now skipped: 18 hits in 4 repositories, every one already inspected by an earlier lane, so no fresh sample exists; on those earlier frozen labels 2/18 (descriptive). The rest are container and guest image homes (/home/agent, /home/claude) and a device service user. Below the 70% bar."
      - Test fixture paths and the /home/linuxbrew/ Homebrew prefix do not couple code to a developer host and stay out.
    external:
      state: net-antidrift
      support: none
      candidates: []
      decision: own-antidrift
      whyThisState: No maintained lint rule reports host-absolute path literals.
      whyNotOtherState: The S4 host-path rule in a private configuration repository covers Python, Bash, JSON, YAML and Markdown only.
    examples:
      flags:
        - 'const root = "/home/joe/code/app";'
      allows:
        - 'const root = join(homedir(), "code/app");'
    nextAction: Keep at error severity in the governance preset.

  antidrift/no-dated-comments:
    status: ready
    stable: false
    defaultOff: false
    directive: S5
    signal: Deterministic comment text match with the date pattern of the S5 dated-comment rule in a private configuration repository
    solveType: no-dated-comments
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/rule-investigations/directive-rules.md
    corpusRepositories: [executor, private-app-4, private-app-2, opencode]
    concerns:
      - "Two-corpus precision check (October 2026; 84 TypeScript roots): 273 hits in 13 repositories (paseo 179), 11/20 true once three ineligible hits (a __mocks__ file twice and a generated protocol binding) are replaced by unseen ones (10/17 plus 1/3). Dates inside quotes, backticks or URLs (format examples, version strings, specification links) are now skipped: 253 hits in 11 repositories; a fresh sample measured 12/20, 9/16 without paseo. Remaining false positives are specification and protocol revision dates written without a URL and dates that describe test data. Below the 70% bar."
      - Comments trailing code on the same line annotate data, and timestamps followed by a time of day are format examples; both stay out.
      - Dated specification revisions such as "MCP Authorization 2025-06-18" still match.
    external:
      state: net-antidrift
      support: none
      candidates: [eslint/no-warning-comments]
      decision: own-antidrift
      whyThisState: no-warning-comments matches configured terms, not dates.
      whyNotOtherState: The date pattern is the provenance signal.
    examples:
      flags:
        - "// Verified against the live API on 2026-06-10."
      allows:
        - "/** @example formatDay(new Date('2026-06-10')) */"
        - 'expect(card).toHaveTextContent("SPEC-002"); // 2024-01-21'
    nextAction: Keep at error severity in the governance preset.

  antidrift/no-round-trip-widening:
    directive: G2
    status: under-proven
    stable: false
    defaultOff: true
    signal: TypeChecker structural coverage of a declared contract against its joined producers and against a downstream recovery that re-establishes the dropped type
    solveType: type-contract-shape
    proofBuckets: [semantic-source-type-provenance]
    semanticAdapterStatus:
      status: inline-pending
      reason: The widening analysis (semantic-adapters/boundary/widening-*.ts and semantic-adapters/callgraph/round-trip-widening.ts with its widening-* helpers) has one consumer; register it in the adapter manifest when a second rule needs it.
    referenceDoc: docs/rule-investigations/no-round-trip-widening.md
    corpusRepositories: [cloudflare-agents, LibreChat, opencode, agent-native]
    concerns:
      - "Not enabled in the shipped preset: a held-out sample of about 300 files from each of agents, LibreChat, opencode and agent-native (1,105 linted, 763 production) gave 8 fresh production findings, all drift: 6 parameter, 2 cast, 0 binding. The bar for error is 20 fresh findings per edge kind across three repositories at 80% or better."
      - "Cannot tell a deliberate decoder of data whose static type was asserted upstream (a normalizer of persisted config, a validator ahead of a schema parse) from a round trip: 6 of the 17 development-sample findings after f3d8706."
      - "Overlaps no-appeasement-erasure's widen-then-assert branch on a local const widened and asserted back; that branch is meant to retire behind this rule."
      - "Callers in another package that deep-imports the module are invisible; callers in the same package outside the program make the parameter edge undecided."
    external:
      state: partial-overlap
      support: medium
      candidates: [dmmulroy/anti-slop/no-widen-then-assert]
      decision: own-antidrift
      whyThisState: "anti-slop's widen-then-assert proves one local const widened and asserted back by syntax; this rule joins every producer across bindings, broad casts and in-program callers, and accepts guard, typeof, in, instanceof and discriminant recoveries."
      whyNotOtherState: "Not equivalent: the upstream rule has no TypeChecker, cannot see callers or accumulator writes, and does not check that the producers carried the asserted type."
    examples:
      flags:
        - "const properties: Record<string, unknown> = { label: { type: 'string' } }; return properties as Record<string, Schema>;"
        - "function labelOf(input: unknown) { return typeof input === 'string' ? input : ''; } labelOf('draft');"
        - "const record = part as Record<string, unknown>; return { ...record, input } as unknown as Part;"
      allows:
        - "function describe(change: Change) { switch (change.kind) { /* every member */ } } describe(created); describe(deleted); describe(renamed);"
        - "const table: Record<string, unknown> = { greeting: 'hi', count: 3 }; const entry = table[key]; return typeof entry === 'string' ? entry : key;"
        - "function isCreated(candidate: Change | null): candidate is Created { return candidate?.kind === 'created'; }"
    nextAction: Grow the held-out sample (at about 11 fresh findings per 1,000 production files, 20 parameter findings need roughly 2,000 more files, and the binding and cast edges far more) before enabling any edge kind at error; see docs/rule-investigations/no-round-trip-widening.md.

retiredRules:
  antidrift/no-appeasement-cast:
    status: retired
    reason: "Retired because typescript-eslint's no-unsafe-type-assertion, which @joedeleeuw/typescript-tooling enables in its type-aware tier, reports every cast this rule reported, including its own test cases (owner decision, October 2026: antidrift does not re-implement ecosystem rules)."
    referenceDoc: docs/rule-investigations/no-appeasement-cast.md
  antidrift/no-unsafe-deserialize:
    status: retired
    reason: "Retired because typescript-eslint's no-unsafe-argument, no-unsafe-assignment and no-unsafe-return, which @joedeleeuw/typescript-tooling enables, and the TypeScript compiler report every JSON.parse case this rule reported, including its own test cases (owner decision, October 2026: antidrift does not re-implement ecosystem rules)."
    referenceDoc: docs/rule-investigations/no-unsafe-deserialize.md
  antidrift/unknown-input-must-be-decoded:
    status: retired
    reason: "Retired because typescript-eslint's no-unsafe-type-assertion and no-unsafe-* rules, which @joedeleeuw/typescript-tooling enables, and the TypeScript compiler report the casts and any values this rule guarded; 0 of 20 fresh sampled reports were real problems (owner decision, October 2026: antidrift does not re-implement ecosystem rules)."
    referenceDoc: docs/rule-investigations/unknown-input-must-be-decoded.md
  antidrift/no-async-array-method:
    status: retired
    reason: "Retired because typescript-eslint's no-misused-promises, which @joedeleeuw/typescript-tooling enables, reports async filter, some, every and find callbacks, and typescript-tooling's ESLint restricted syntax reports async forEach callbacks; across opencode, LibreChat and cloudflare/agents no async forEach occurred (owner decision, October 2026: antidrift does not re-implement ecosystem rules)."
