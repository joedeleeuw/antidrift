schemaVersion: 1

semanticFactKinds:
  identitySchemaTransform:
    rules:
      - antidrift/no-identity-schema-transform
    adapterId: typescript-eslint/schema-provenance
    carrier: semantic-adapter
    confidence:
      - deterministic-enforcement
    emission:
      - blocking-diagnostic
    association: Zod transform callbacks to direct identity values or to closed schema input shapes with exact object pass-through reconstruction. Direct identity has null inputShape and outputShape because no key set is inspected.
    noSinkBehavior: The identity-transform diagnostic still reports; only the serialized semantic fact is skipped.
    payloadFields:
      - diagnostic
      - inputShape
      - outputShape
      - transform
  broadSetterCoMutation:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - heuristic-inventory
    emission:
      - inventory-only
    association: React setter calls to state cells within one function frame.
    noSinkBehavior: No fact is emitted and no diagnostic is produced; broad co-mutation remains non-blocking.
    payloadFields:
      - transition
      - requestGuard
      - setterCount
      - cells
  resourceLifecycleProof:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - deterministic-enforcement
    emission:
      - blocking-diagnostic
    association: React state cells to lifecycle roles through async transition writes, catch-scope error writes, awaited or awaited-member resource assignment, updater invalidation, and request-guard evidence.
    noSinkBehavior: The diagnostic still reports; only the serialized semantic fact is skipped.
    payloadFields:
      - boolCell
      - errorCell
      - payloadCell
      - transition
      - requestGuard
      - setterCount
      - cells
  sourceMemberStateShardCandidate:
    rules:
      - antidrift/no-handrolled-resource-lifecycle-cells
    adapterId: react-state
    carrier: semantic-adapter
    confidence:
      - heuristic-inventory
    emission:
      - inventory-only
    association: React state cells to distinct members of one freshly awaited source object as fact-only inventory; no accepted owned-entity enforcement tier currently exists.
    noSinkBehavior: No diagnostic is produced. Without a semantic fact sink, the rule produces no externally visible output.
    payloadFields:
      - source
      - members
      - editableCells
      - transition
      - requestGuard
  structuralMatch:
    rules:
      - antidrift/no-structural-type-fork
    adapterId: typescript-eslint/type-owner
    carrier: authority-registry
    confidence:
      - deterministic-enforcement
      - deterministic-inventory
    emission:
      - blocking-diagnostic
      - inventory-proposal
    association: Local handwritten object contracts to accepted or proposed generated, domain, or package owner types.
    noSinkBehavior: Accepted generated, domain, and package owner diagnostics still report; unaccepted installed-package owner proposals are not collected.
    payloadFields:
      - authorityState
      - diagnostic
      - localType
      - ownerType
      - structuralMatch
  changeContractConformance:
    rules: []
    commandIds:
      - antidrift/change-contract
    adapterId: change-contract
    carrier: change-relative
    confidence:
      - deterministic-inventory
    emission:
      - inventory-only
    association: Merge-base diff surface to a machine-readable change contract.
    noSinkBehavior: The CLI still prints the conformance summary; only the serialized semantic fact is skipped.
    payloadFields:
      - contractState
      - changeContext
      - declaredScope
      - actualChangeSurface
      - violations
      - decision

retiredRules:
  antidrift/no-restated-dependency-type:
    status: retired
    reason: Merged into antidrift/no-structural-type-fork for graduated manifest and public-export ownership inference with exact structural comparison.
    mergedInto: antidrift/no-structural-type-fork
  antidrift/no-canonical-model-fork:
    status: retired
    reason: Merged into antidrift/no-structural-type-fork for accepted domain ownership and proven owner projections.
    mergedInto: antidrift/no-structural-type-fork
  antidrift/no-inline-structural-type-at-use-site:
    status: retired
    reason: Merged into antidrift/no-structural-type-fork for bounded inline boundary and local named-type reuse.
    mergedInto: antidrift/no-structural-type-fork
  antidrift/no-duplicated-object-field-blocks:
    status: retired
    reason: Merged into antidrift/no-structural-type-fork for bounded TypeScript and Zod field-block duplication analysis.
    mergedInto: antidrift/no-structural-type-fork
  antidrift/no-redundant-local-return-type:
    status: retired
    reason: Merged into antidrift/no-structural-type-fork for proven enclosing return-contract ownership.
    mergedInto: antidrift/no-structural-type-fork
  antidrift/no-status-literal-in-type:
    status: retired
    reason: Merged into antidrift/no-redeclared-owned-union, which now owns canonical status literal and runtime-array union derivation with owner-file exemptions.
    mergedInto: antidrift/no-redeclared-owned-union
    referenceDoc: docs/rule-investigations/no-redeclared-owned-union.md
  antidrift/no-validator-output-oracle:
    status: retired
    reason: Merged into antidrift/no-nonindependent-test-oracle, preserving validatorOutputOracle and validatorThrowOracle diagnostics for assertions that lack an independent expectation.
    mergedInto: antidrift/no-nonindependent-test-oracle
    referenceDoc: docs/rule-investigations/test-validator-oracles.md
  antidrift/no-static-property-loop:
    status: retired
    reason: Merged into antidrift/no-nonindependent-test-oracle, preserving staticPropertyEcho for hardcoded loops that restate a precomputed object's static shape.
    mergedInto: antidrift/no-nonindependent-test-oracle
    referenceDoc: docs/test-quality-taxonomy.md
  antidrift/no-schema-library-in-test:
    status: retired
    reason: Removed the blanket runtime-schema import ban. Schema values remain valid application inputs and boundary decoders; self-validating oracles are handled by antidrift/no-nonindependent-test-oracle.
    mergedInto: antidrift/no-nonindependent-test-oracle
    referenceDoc: docs/rule-investigations/test-validator-oracles.md
  antidrift/no-bag-reshaper:
    status: retired
    reason: Merged into antidrift/no-contract-appeasement-projection, sharing bag-projection analysis and preserving bagToContract and bagToBag diagnostics.
    mergedInto: antidrift/no-contract-appeasement-projection
  antidrift/no-trivial-property-helpers:
    status: retired
    reason: Merged into antidrift/no-wrapping-functions. Property reads and literal fallbacks now require verified inlining rather than banned helper names.
    mergedInto: antidrift/no-wrapping-functions
    referenceDoc: docs/rule-investigations/no-wrapping-functions.md
  antidrift/no-duplicate-context:
    status: retired
    reason: Merged into antidrift/no-vague-names, preserving the duplicate diagnostic for repeated adjacent context words in function names.
    mergedInto: antidrift/no-vague-names
    referenceDoc: docs/rule-investigations/portable-rules.md
  antidrift/no-ai-debt-comments:
    status: retired
    reason: Merged into antidrift/no-todo-without-issue, preserving AI-plus-debt detection, ticket exemptions, and one prioritized diagnostic per comment.
    mergedInto: antidrift/no-todo-without-issue
    referenceDoc: docs/rule-investigations/portable-rules.md
  antidrift/no-silent-empty-detection-fallback:
    status: retired
    reason: Merged into antidrift/no-sentinel-absence-fallback, preserving noSilentEmptyFallback and its recovery-source details independently of member-sentinel configuration.
    mergedInto: antidrift/no-sentinel-absence-fallback
    referenceDoc: docs/rule-investigations/directive-rules.md
  antidrift/no-fallback-to-empty:
    status: retired
    reason: Merged into antidrift/no-anemic-errors, preserving the fallback diagnostic and silent catch or promise-catch proof.
    mergedInto: antidrift/no-anemic-errors
    referenceDoc: docs/rule-investigations/directive-rules.md
  antidrift/no-raw-fetch-in-component:
    status: retired
    reason: Merged into antidrift/no-handrolled-resource-lifecycle-cells. Raw fetch alone is not a violation; scope-bound fetch is evidence only for a proven hand-rolled lifecycle.
    mergedInto: antidrift/no-handrolled-resource-lifecycle-cells
    referenceDoc: docs/semantic-validation-matrix.md
  antidrift/no-defensive-shape-probing:
    status: retired
    reason: Merged into antidrift/unknown-input-must-be-decoded, preserving threshold 4, broad Object.entries proof, type-predicate exemption, and the defensiveShapeProbe message.
    mergedInto: antidrift/unknown-input-must-be-decoded
    referenceDoc: docs/semantic-validation-matrix.md
  antidrift/no-generic-module-names:
    status: retired
    reason: Removed by owner request. Generic filename blocklists are opinionated naming policy rather than Antidrift contract-drift enforcement; no explicit opt-in implementation is retained.
  antidrift/no-hash-literal:
    status: retired
    reason: Removed by owner request. Source provenance belongs to version control and release metadata, not a hash-literal lint policy.
  antidrift/no-open-dictionary-at-boundary:
    status: retired
    reason: Replaced by typescript-tooling's maintained typescript/no-explicit-any and @typescript-eslint/no-explicit-any defaults, which own the explicit-any boundary signal without a second custom implementation.
    referenceDoc: docs/rule-investigations/no-open-dictionary-at-boundary.md
  antidrift/no-else-if-chain:
    status: retired
    reason: Replaced by typescript-tooling's unicorn-js/prefer-switch (Unicorn prefer-switch) with minimumCases 4 for strict-equality chains over one discriminant. The former loose-equality branch is intentionally not retained; switch declares the case space.
    referenceDoc: docs/rule-investigations/directive-rules.md
  antidrift/no-raw-react-native-touchables:
    status: retired
    reason: Replaced by generated no-restricted-imports patterns for the maintained React Native and gesture-handler primitive inventory. Namespace, default, named and re-export forms remain restricted; type-only imports are allowed and policy/registries/react-native.yaml owns exact owner-file exceptions.
    referenceDoc: docs/rule-investigations/no-raw-react-native-touchables.md
  antidrift/no-host-path-literal:
    status: retired
    reason: Replaced by generated governance-eslint/no-restricted-syntax selectors for /Users/<user>/ and /home/<user>/ literals and no-substitution template text, retaining the Homebrew and test/story/mock/e2e exclusions.
    referenceDoc: docs/rule-investigations/directive-rules.md
  antidrift/no-query-data-type-parameters:
    status: retired
    reason: Superseded by antidrift/no-explicit-type-arguments-on-owned-api, which resolves the callee symbol and proves registration ownership instead of matching method names; the syntax rule's ad-hoc key coverage was doctrine-rejected (no resolvable owner means no fork).
    referenceDoc: docs/rule-investigations/sentry-mined-react-rules.md
  antidrift/no-cycle:
    status: retired
    reason: Replaced by Oxlint's native import/no-cycle rule.
    referenceDoc: docs/rule-investigations/no-cycle.md
  antidrift/no-inline-disable-without-ticket:
    status: retired
    reason: Replaced by Oxlint-hosted eslint-comments/require-description plus native typescript/ban-ts-comment.
  antidrift/no-sdk-direct-use:
    status: retired
    reason: Replaced by generated Oxlint core no-restricted-imports rules with wrapper-file overrides from policy/registries/gateways.yaml.
  antidrift/no-explicit-return-type-private-helper:
    status: retired
    reason: Real Chaski code showed explicit private helper return types are often legitimate contracts.
  antidrift/no-silent-catch:
    status: retired
    reason: Retired after utility review; Oxlint no-empty, preserve-caught-error, and no-console cover enough of the low-value surface, while the remaining console-only/comment-only custom behavior did not justify ownership.
  antidrift/no-thin-typed-factory-wrapper:
    status: retired
    reason: Read-only corpus review found no real non-test exact-forward internal drift, while broad typed-constructor wrappers and exported facades are clean controls with high false-positive risk.
    referenceDoc: docs/rule-investigations/no-thin-typed-factory-wrapper.md
  antidrift/no-obvious-comment:
    status: retired
    reason: Token-overlap comment restatement produced review-style noise and did not justify custom lint ownership.
  antidrift/no-role-literal-in-type:
    status: retired
    reason: Role words are too generic without canonical model context, and no accepted real role-union redeclaration was found.
    referenceDoc: docs/rule-investigations/no-role-literal-in-type.md
  antidrift/no-hover-translate-card:
    status: retired
    reason: Removed from the shipped plugin surface; the former class-string sampler did not prove card or pointer-target context.
    referenceDoc: docs/rule-roadmap.md
  antidrift/no-raw-tailwind-color:
    status: retired
    reason: Removed from the shipped plugin surface; the former class-token sampler hardcoded a tiny palette instead of proving semantic token authority.
    referenceDoc: docs/rule-roadmap.md
  antidrift/no-cast-to-branded:
    status: retired
    reason: No real non-test branded cast forgery was found, and the current rule only detected the package's own under-adopted brand marker.
    referenceDoc: docs/rule-investigations/no-cast-to-branded.md
  antidrift/no-status-triplet-state:
    status: retired
    reason: Retired after the provable resource-lifecycle subset moved into antidrift/no-handrolled-resource-lifecycle-cells through semantic AST React state graph proof; standalone configurable name groups are inventory, not enforcement.
    referenceDoc: docs/rule-investigations/no-status-triplet-state.md
  antidrift/no-parse-as-cast:
    status: retired
    reason: Consolidated into antidrift/no-redundant-zod-parse, which now owns both same-binding validation provenance and declared schema-output parameter provenance across Zod and Effect Schema.
    referenceDoc: docs/rule-investigations/no-parse-as-cast.md
  antidrift/no-convex-return-widening:
    status: retired
    reason: Consolidated into antidrift/require-convex-return-validator, which now verifies both the presence of a returns validator and the absence of widened v.any() leaves on registered Convex functions.
    referenceDoc: docs/rule-investigations/no-convex-return-widening.md
  antidrift/no-mocked-response-body-oracle:
    status: retired
    reason: Consolidated into antidrift/no-nonindependent-test-oracle, which now reports same-test mocked response.json() body-shape echoes alongside its other non-independent oracle branches.
    referenceDoc: docs/rule-investigations/test-validator-oracles.md
  antidrift/no-conditional-empty-object-spread:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; conditional spreads are often the exact typed representation of optional fields without type-evidence loss.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-module-mocking:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; test-oracle independence is enforced by antidrift/no-nonindependent-test-oracle rather than a blanket syntax ban on module mocks.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-object-parameters:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; broad input boundary contracts are enforced by antidrift/unknown-input-must-be-decoded and maintained explicit-any rules.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-reflect-apply:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; syntax-only Reflect.apply prohibition cannot distinguish legitimate dynamic adapter invocation from type-evidence escape.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-reflect-get:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; broad Object.entries mini-parsers and untrusted boundary access are enforced by antidrift/unknown-input-must-be-decoded.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-runtime-typeof:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; syntax-only typeof bans reject ordinary primitive narrowing while antidrift/unknown-input-must-be-decoded and antidrift/no-underchecked-type-predicate own the contract-laundering subsets.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-shattered-ingested-entity-state:
    status: retired
    reason: Consolidated into antidrift/no-handrolled-resource-lifecycle-cells, which now emits sourceMemberStateShardCandidate semantic facts alongside resourceLifecycleProof and stateSetterCoMutation from a single React state cell and transition pass.
    referenceDoc: docs/rule-investigations/no-shattered-ingested-entity-state.md
  antidrift/no-shape-in-symbol-names:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; antidrift/no-vague-names and antidrift/no-compat-names own symbol-naming hygiene without rejecting legitimate domain vocabulary.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unknown-parameters:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; unknown is the honest input type at untrusted boundaries, and antidrift/unknown-input-must-be-decoded enforces decoding before domain claims.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unknown-returns:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; unknown is an honest output for raw external sources, and antidrift/unknown-input-must-be-decoded enforces decoding at consumers.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unsafe-dictionary-type:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; antidrift/no-open-dictionary-at-boundary owns open dictionary contracts at exported and boundary surfaces.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/require-safety-comment-for-type-assertion:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; comments are not type evidence, and antidrift/no-appeasement-cast and antidrift/no-appeasement-erasure own type-assertion discipline.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
