          "@typescript-eslint/no-unsafe-type-assertion",
        ]
      decision: own-antidrift
      whyThisState: "Upstream rules report the cast that re-establishes an erased value. This rule reports the erasure itself, schema and Effect decoder re-establishment that no upstream rule proves, and case tables annotated instead of checked with satisfies."
      whyNotOtherState: "Not equivalent because upstream does not use TypeChecker source provenance or schema ownership; partial because a cast that re-establishes an erased value is also reported upstream."
    examples:
      flags:
        - "const result: unknown = auth.getAuthSnapshot(); return resultSchema.parse(result);"
        - "const result = getSnapshot() as unknown; return result as AuthSnapshot;"
      allows:
        - "const raw: unknown = JSON.parse(text); return schema.parse(raw);"
        - "const exact = { id: 'u1' } satisfies User;"
    nextAction: "Re-measure precision without the known-value-widening branch before relying on the October 12 sample; keep blocking at error."
