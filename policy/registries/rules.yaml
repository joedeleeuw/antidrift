  antidrift/no-nonindependent-test-oracle:
    status: ready
    stable: false
    defaultOff: true
    signal: AST
    solveType: test-quality-nonindependent-oracle
    proofBuckets: [local-ast-source-shape]
    referenceDoc: docs/test-quality-taxonomy.md
    corpusRepositories: [dotfiles, agent-guardrails-monorepo-template]
    concerns:
      - This rule subsumes the earlier bare membership assertion guard. Bare membership, key existence, dependency outcome flags and error shapes, arranged-input echoes, arranged-length echoes, vacuous existence checks, and mock call-through echoes are branches of the same non-independent oracle smell.
      - The rule is intentionally test-file scoped and AST/source-shape based. It proves the assertion restates arranged data or a dependency-level result, not that every replacement assertion is sufficient.
      - Test helpers with assertion-shaped matcher names can be reported because the rule treats matcher chains in test files as assertion syntax.
    external:
      state: net-antidrift
      support: low
      candidates: ["ESLint no-restricted-syntax", "ast-grep"]
      decision: own-antidrift
      whyThisState: "Selector-based tools can match fragments of this shape, but the project needs one named guardrail that reasons across act bindings, arranged literals, assertion targets, and matcher variants."
      whyNotOtherState: "Not ecosystem-covered because maintained test lint plugins do not classify arranged-input echo, dependency outcome flags, mock call-through, list membership, or object key existence as one low-value oracle family."
    examples:
      flags:
        - 'assert.equal(items.some((item) => item.name === "node_repl"), false);'
        - 'expect(names).toContain("executor");'
        - "const parsed = schema.parse(fixture); expect(parsed).toEqual(fixture);"
        - 'expect(schema.safeParse({ status: "bad" }).success).toBe(false);'
        - 'const result = schema.safeParse(arrangedBad); expect(result.error.issues[0].message).toBe("authored message");'
        - 'expect(() => schema.parse(arrangedBad)).toThrow("invalid input");'
        - "service.save(user); expect(repository.save).toHaveBeenCalledWith(user);"
