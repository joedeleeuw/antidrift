      blockingThreshold: Same-schema reparse reports only when TypeScript proves the consumed value was already produced by or declared from that schema output.
      ecosystemComparison: Generic unsafe-assignment or Zod style rules do not track same-schema provenance from parsed values or declared schema-output parameters.
      corpusEvidence: A private app provides same-schema drift; two other private apps provide first-boundary parse and test-contract clean controls.
