      - Runs in the ESLint pass so existing debt is pinned in eslint-suppressions.json.
      - "`compatible` is excluded: an OpenAI-compatible protocol is a shape, not a compatibility path."
      - Antidrift's own retiredRules ledger is G16 debt held in the suppressions file.
    external:
      state: net-antidrift
      support: none
      candidates: [eslint/id-denylist, typescript/no-deprecated]
      decision: own-antidrift
      whyThisState: id-denylist matches whole names only and typescript/no-deprecated reports uses of deprecated APIs, not declarations that keep an old path.
      whyNotOtherState: The directive targets substrings in declared names across declaration kinds.
    examples:
      flags:
        - "function readLegacyConfig() {}"
        - "interface RetiredRule { id: string }"
      allows:
