        - 'const isUser = (value: unknown): value is User => value != null && typeof value === "object";'
        - 'type FsError = { code: string; path: string }; const isFsError = (value: unknown): value is FsError => typeof value === "object" && value !== null && "code" in value && value.code === "ENOENT";'
        - 'const isConflictError = (value: unknown): value is ConflictError => typeof value === "object" && value !== null && "_tag" in value && value._tag === "ConflictError";'
        - 'type Resize = { source: "embed"; type: "resize"; height: number }; type Message = Resize | Session; function isMessage(data: unknown): data is Message { if (typeof data !== "object" || data === null) return false; const candidate = data as { source?: unknown; type?: unknown }; return candidate.source === "embed" && typeof candidate.type === "string"; }'
