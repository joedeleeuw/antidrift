    concerns:
      - "October 12 2026 precision (same 79-root corpus, typed sample pool of 49 resolved roots): 4,729 hits in 57 repositories (pool 3,124 in 36: paseo 724, LibreChat 577, executor 340, a private app 301). Hand-checked 20 across 20 repositories: 19/20. The false positive is a `let` accumulator (hunk src/core/cli.ts:817) whose later assignment needs the declared type."
      - "This is the upstream gate for the rest of the contract family. In a private app's desktop code, no-redundant-zod-parse, no-appeasement-cast, no-contract-appeasement-projection, no-unsafe-deserialize, and no-defensive-shape-probing all report zero across 38 files while one module alone holds 21 parse calls; the erased bindings declare unknown, so no type comparison can fire. Measured 2026-08-03 on a remediation branch: removing the twelve annotations took no-redundant-zod-parse from 0 to 8 findings (six in that module, two in another) with no rule changes; the other four rules stayed at zero, so the erasures were masking redundant parses specifically."
      - "The local TypeChecker branch retains schema and Effect decoder provenance. The vendored anti-slop widen-then-assert branch was removed in October 2026 with the other copied rules; typescript-eslint's no-unsafe-type-assertion, which @joedeleeuw/typescript-tooling enables, reports the cast back."
      - "The 12 positives in that private app include erasures of `boolean` and `string | null`, which is why this reads as a uniform edge reflex rather than deliberate defensive validation of complex payloads."
      - "Cast-shaped escape hatches are rare in the anchor repo (2 `as unknown`, 0 `as any` across src), so the annotation form carries the evidence. The `as unknown` branch is fixture-backed but has no real-corpus anchor yet."
      - "Only const bindings are reported. A reassigned binding is a traversal cursor rather than a boundary value; the one Executor positive (packages/plugins/openapi/src/sdk/openapi-utils.ts:42) was a `let` walking an untyped OpenAPI document with a guarded Record cast, and narrowing to const removed it."
      - "Zero findings in a repository is not yet evidence of clean code. Executor, PowerSync Service, and Agent Browser were swept and returned zero, but they carry 5, 1, and 0 zod-importing files respectively, so the parse branch cannot fire there by construction and they are excluded from corpusRepositories. Only Cloudflare Agents (76 zod-importing files, 371 candidates, 0 findings) and another private app (17 zod files, 34 candidates, 0 findings) are real clean controls."
      - "Effect Schema decode branch landed 2026-08-03: curried Schema.decode*/decodeUnknown* applications resolved to the effect package now count as contract re-establishment. Executor re-swept with the branch active: 0 findings across 342 candidate files and 168 decode sites, so its zero is now evidence rather than blindness, and executor rejoins corpusRepositories as a clean control. Pre-built decoder bindings (const dec = Schema.decodeUnknownSync(S); dec(value)) are a recorded false-negative slice, unimplemented until a real anchor appears."
      - "October 22 2026: the vendored known-value-widening branch is unwired. It reported widening with no recovery requirement. A labelled sample of 12 current-upstream anti-slop hits across BuilderIO/agent-native, cloudflare/agents, LibreChat and opencode found no drift (annotations equal to the inferred type, owner and public-API contracts, runtime-key lookup tables, guard parameters, parser returns), and on 41 sampled cloudflare/agents files the branch produced 79 of this rule's 82 findings. The October 12 precision sample above covers the composed rule and is not a measurement of the rule without that branch."
      - "Chained assertions are reported by typescript-eslint's no-unsafe-type-assertion through @joedeleeuw/typescript-tooling; antidrift/no-unsafe-cast-chain is retired."
    external:
      state: partial-overlap
      support: high
      candidates:
