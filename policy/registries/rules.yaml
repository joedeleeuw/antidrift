        - docs/real-corpus-validation.md
      replicationsNotIntroducedForTest: true
      knownFalsePositives: 0
      knownFalseNegatives: Unconfigured generated sources or package owners, non-exact forks, copied owner models with extra or missing fields, owner types below the shared property threshold, and owner declarations outside the active TypeScript Program are outside the blocking proof.
      productionConcerns: Keep default-off until a real exact generated-source or accepted package-owner copy appears in at least one external repo and projected DTO/view-model clean controls are revalidated under that owner configuration.
      noSinkBehavior: Accepted generated/package owner diagnostics do not depend on the optional semantic fact sink; unaccepted installed-package matches stay proposal facts only when a sink is configured.
      noDeadWorkBehavior: Imports, aliases, zod wrappers around imported types, utility derivations, projected DTO subsets, all-optional local patch shapes, and exact matches to unaccepted installed-package candidates stay non-blocking.
    referenceDoc: docs/rule-roadmap.md
    corpusRepositories: [private-app, private-app-2]
