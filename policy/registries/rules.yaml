        - 'assert.deepEqual(runtimeConnections.map((server) => server.name), ["needle", "context7"]);'
        - "expect(renderConfig(registry)).toEqual({ mcpServers: { executor: { url } } });"
        - "expect(schema.parse(valid).activation).toEqual(validActivation);"
        - 'expect(renderActivation(schema.parse(valid))).toBe("activation enabled");'
        - "trigger(); trigger(); expect(handler).toHaveBeenCalledTimes(1);"
    nextAction: "Inventory existing guardrails and dotfiles findings, then split actionable replacements into behavioral/full-output assertions while tracking noisy branches before stable promotion."
