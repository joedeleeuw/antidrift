    reason: "Copied from @rikalabs/oxlint-standards 0.8.1. Antidrift no longer ships rules copied from other projects (owner decision, October 2026); @joedeleeuw/typescript-tooling enables the published upstream rule bun-no-bun-specific-in-shared instead."
    referenceDoc: docs/rule-investigations/portable-rules.md
  antidrift/no-as-never:
    status: retired
    reason: "Copied from @rikalabs/oxlint-standards 0.8.1. Retired because typescript-eslint's no-unsafe-type-assertion, which @joedeleeuw/typescript-tooling enables, already reports casts to never (owner decision, October 2026)."
    referenceDoc: docs/rule-investigations/portable-rules.md
  antidrift/no-unsafe-cast-chain:
    status: retired
    reason: "Adapted from dmmulroy/anti-slop no-chained-type-assertions. Retired because typescript-eslint's no-unsafe-type-assertion, which @joedeleeuw/typescript-tooling enables, already reports each narrowing step of a chained cast (owner decision, October 2026)."
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unknown-type-aliases:
    status: retired
    reason: "Adapted from dmmulroy/anti-slop. Antidrift no longer ships rules copied from other projects (owner decision, October 2026); @joedeleeuw/typescript-tooling maintains the vendored copy as tooling/no-unknown-type-aliases."
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-query-data-type-parameters:
    status: retired
    reason: Superseded by antidrift/no-explicit-type-arguments-on-owned-api, which resolves the callee symbol and proves registration ownership instead of matching method names; the syntax rule's ad-hoc key coverage was doctrine-rejected (no resolvable owner means no fork).
    referenceDoc: docs/rule-investigations/sentry-mined-react-rules.md
  antidrift/no-cycle:
    status: retired
    reason: Replaced by Oxlint's native import/no-cycle rule.
    referenceDoc: docs/rule-investigations/no-cycle.md
  antidrift/no-inline-disable-without-ticket:
    status: retired
    reason: Replaced by Oxlint-hosted eslint-comments/require-description plus native typescript/ban-ts-comment.
  antidrift/no-sdk-direct-use:
    status: retired
    reason: Replaced by generated Oxlint core no-restricted-imports rules with wrapper-file overrides from policy/registries/gateways.yaml.
  antidrift/no-explicit-return-type-private-helper:
    status: retired
    reason: Real private-app code showed explicit private helper return types are often legitimate contracts.
  antidrift/no-silent-catch:
    status: retired
    reason: Retired after utility review; Oxlint no-empty, preserve-caught-error, and no-console cover enough of the low-value surface, while the remaining console-only/comment-only custom behavior did not justify ownership.
  antidrift/no-thin-typed-factory-wrapper:
    status: retired
    reason: Read-only corpus review found no real non-test exact-forward internal drift, while broad typed-constructor wrappers and exported facades are clean controls with high false-positive risk.
    referenceDoc: docs/rule-investigations/no-thin-typed-factory-wrapper.md
  antidrift/no-obvious-comment:
    status: retired
    reason: Token-overlap comment restatement produced review-style noise and did not justify custom lint ownership.
  antidrift/no-role-literal-in-type:
    status: retired
    reason: Role words are too generic without canonical model context, and no accepted real role-union redeclaration was found.
    referenceDoc: docs/rule-investigations/no-role-literal-in-type.md
  antidrift/no-hover-translate-card:
    status: retired
    reason: Removed from the shipped plugin surface; the former class-string sampler did not prove card or pointer-target context.
    referenceDoc: docs/rule-roadmap.md
  antidrift/no-raw-tailwind-color:
    status: retired
    reason: Removed from the shipped plugin surface; the former class-token sampler hardcoded a tiny palette instead of proving semantic token authority.
    referenceDoc: docs/rule-roadmap.md
  antidrift/no-cast-to-branded:
    status: retired
    reason: No real non-test branded cast forgery was found, and the current rule only detected the package's own under-adopted brand marker.
    referenceDoc: docs/rule-investigations/no-cast-to-branded.md
  antidrift/no-status-triplet-state:
    status: retired
    reason: Retired after the provable resource-lifecycle subset moved into antidrift/no-handrolled-resource-lifecycle-cells through semantic AST React state graph proof; standalone configurable name groups are inventory, not enforcement.
    referenceDoc: docs/rule-investigations/no-status-triplet-state.md
  antidrift/no-parse-as-cast:
    status: retired
    reason: Consolidated into antidrift/no-redundant-zod-parse, which now owns both same-binding validation provenance and declared schema-output parameter provenance across Zod and Effect Schema.
    referenceDoc: docs/rule-investigations/no-parse-as-cast.md
  antidrift/no-convex-return-widening:
    status: retired
    reason: Consolidated into antidrift/require-convex-return-validator, which now verifies both the presence of a returns validator and the absence of widened v.any() leaves on registered Convex functions.
    referenceDoc: docs/rule-investigations/no-convex-return-widening.md
  antidrift/no-mocked-response-body-oracle:
    status: retired
    reason: Consolidated into antidrift/no-nonindependent-test-oracle, which now reports same-test mocked response.json() body-shape echoes alongside its other non-independent oracle branches.
    referenceDoc: docs/rule-investigations/test-validator-oracles.md
  antidrift/no-conditional-empty-object-spread:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; conditional spreads are often the exact typed representation of optional fields without type-evidence loss.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-module-mocking:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import that reported every module mock by syntax. antidrift/no-first-party-module-mock replaces it and reports only mocks whose specifier resolves to a first-party module.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-object-parameters:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; broad input boundary contracts are enforced by antidrift/no-open-dictionary-at-boundary and, when enabled, antidrift/unknown-input-must-be-decoded.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-reflect-apply:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; syntax-only Reflect.apply prohibition cannot distinguish legitimate dynamic adapter invocation from type-evidence escape.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-reflect-get:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; dynamic property probing and untrusted boundary access are enforced by antidrift/no-defensive-shape-probing and, when enabled, antidrift/unknown-input-must-be-decoded.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-runtime-typeof:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; syntax-only typeof bans reject ordinary primitive narrowing while antidrift/no-defensive-shape-probing and antidrift/no-underchecked-type-predicate own the contract-laundering subsets.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-shattered-ingested-entity-state:
    status: retired
    reason: Consolidated into antidrift/no-handrolled-resource-lifecycle-cells, which now emits sourceMemberStateShardCandidate semantic facts alongside resourceLifecycleProof and stateSetterCoMutation from a single React state cell and transition pass.
    referenceDoc: docs/rule-investigations/no-shattered-ingested-entity-state.md
  antidrift/no-shape-in-symbol-names:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; antidrift/no-compat-names and the opt-in antidrift/no-vague-names own symbol-naming hygiene without rejecting legitimate domain vocabulary.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unknown-parameters:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; unknown is the honest input type at untrusted boundaries; antidrift/no-appeasement-cast reports casts from it, and antidrift/unknown-input-must-be-decoded, when enabled, enforces decoding before domain claims.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unknown-returns:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; unknown is an honest output for raw external sources; antidrift/no-appeasement-cast reports casts from it, and antidrift/unknown-input-must-be-decoded, when enabled, enforces decoding at consumers.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/no-unsafe-dictionary-type:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; antidrift/no-open-dictionary-at-boundary owns open dictionary contracts at exported and boundary surfaces.
    referenceDoc: docs/rule-investigations/anti-slop-import.md
  antidrift/require-safety-comment-for-type-assertion:
    status: retired
    reason: Retired default-off false-positive-prone anti-slop import; comments are not type evidence, and antidrift/no-appeasement-cast and antidrift/no-appeasement-erasure own type-assertion discipline.
    referenceDoc: docs/rule-investigations/anti-slop-import.md

