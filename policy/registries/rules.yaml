      - A private app supplies clean controls for primitive predicates, alias-based field checks, and third-party union predicates.
      - Another private app supplies a destructured-field clean control for object predicates.
      - Sudocode supplies clean controls for field-complete broad-input predicates and discriminant-only union predicates.
