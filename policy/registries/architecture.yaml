layers:
  shared:
    role: domain
    roots: ["apps/shape-sample/src/shared/**"]
    mayImport: ["shared"]
  runtime:
    roots: ["apps/shape-sample/src/runtime/**"]
    mayImport: ["runtime", "shared"]
  generated:
    roots: ["apps/shape-sample/src/generated/**"]
    mayImport: ["generated", "runtime", "shared", "methods", "pubs", "routes"]
  server:
    roots: ["apps/shape-sample/src/server/**"]
    mayImport: ["server", "shared"]
  methods:
    role: boundary
    roots: ["apps/shape-sample/src/methods/**"]
    mayImport: ["methods", "server", "shared"]
  pubs:
    role: boundary
    roots: ["apps/shape-sample/src/pubs/**"]
    mayImport: ["pubs", "server", "shared"]
  routes:
    role: boundary
    roots: ["apps/shape-sample/src/routes/**"]
    mayImport: ["routes", "server", "shared"]
  client:
    roots: ["apps/shape-sample/src/client/**"]
    mayImport: ["client", "generated", "shared"]
  tooling:
    roots: ["tooling/**"]
    mayImport: ["tooling"]
